<!--
  presets/components/lower-third-card.html — approved motion direction:
  "lower-third card" (stat or quote callout, slides in from the left,
  holds, slides out).

  This is a SUB-COMPOSITION template, not a standalone file — copy it
  into a job's hf-graphics/compositions/part-NN.html and:
    1. Replace __COMP_ID__ with a unique id (must match the host slot's
       data-composition-id AND data-composition-src filename).
    2. Replace __LABEL__ (small eyebrow, e.g. "stat callout") and
       __VALUE__ (the actual stat/quote, e.g. "62% report burnout").
    3. Set the host slot's data-width/data-height to the job's canvas
       (1080x1920 for short-form) and data-duration to ~2.5-3s per use.
  Positioned at top: 20% — inside the y 200-1620 short-form safe zone on
  a 1920-tall canvas (20% of 1920 = 384px, well clear of the top 200px
  excluded band). Re-check against the actual canvas height if this is
  reused on a non-standard size.
-->
<!doctype html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .card {
          position: absolute;
          left: 40px;
          top: 20%;
          max-width: 78%;
          background: #101013;
          border-left: 4px solid #ff5a36;
          border-radius: 0 10px 10px 0;
          padding: 14px 20px;
          opacity: 0;
        }
        .eyebrow {
          font-family: 'Inter', sans-serif;
          font-weight: 600;
          font-size: 15px;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: #9a9aa2;
          margin: 0 0 4px;
        }
        .value {
          font-family: 'Inter', sans-serif;
          font-weight: 800;
          font-size: 30px;
          color: #f5f5f2;
          margin: 0;
          line-height: 1.15;
        }
      </style>

      <div id="root" data-composition-id="__COMP_ID__" data-width="1080" data-height="1920">
        <div class="card" id="lt-card">
          <p class="eyebrow">__LABEL__</p>
          <p class="value">__VALUE__</p>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        // in: slide from -24px + fade, expo-out ~= preset's cubic-bezier(.16,1,.3,1)
        tl.fromTo('#lt-card', { x: -24, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.28, ease: 'expo.out' })
          .to('#lt-card', { autoAlpha: 1, duration: 1.8 })  // hold
          // out: slide back + fade, expo-in ~= preset's cubic-bezier(.7,0,.84,0)
          .to('#lt-card', { x: -16, autoAlpha: 0, duration: 0.2, ease: 'expo.in' });
        window.__timelines['__COMP_ID__'] = tl;
      </script>
    </template>
  </body>
</html>
