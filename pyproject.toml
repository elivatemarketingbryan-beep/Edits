[project]
name = "claude-editor-pipeline"
version = "0.1.0"
description = "Python side of the content pipeline: transcription, cut-boundary measurement, transcript remapping, audio QA."
requires-python = ">=3.10"
dependencies = [
  "whisperx>=3.1,<4",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pillow>=10.0",
]

[tool.uv]
# WhisperX pulls in torch. On first `uv sync` / `uv run` this download is
# large (multiple GB with CUDA wheels on Linux). If you are CPU-only, set
#   UV_INDEX=https://download.pytorch.org/whl/cpu
# before syncing to get the much smaller CPU-only torch build.
