<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Demand Reputation Flywheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0a08;
        --bg2: #17140f;
        --accent: #d9a94a;
        --accent-bright: #f4d998;
        --text: #f5f1e6;
        --muted: #9c9384;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", ui-sans-serif, sans-serif;
      }

      /* full-bleed background fill: transparent until the hook lands, then
         opaque near-black for the rest of the piece (alpha-overlay export) */
      #bg-fill {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(120% 120% at 50% 42%, var(--bg2) 0%, var(--bg) 62%);
        opacity: 0;
      }

      /* single continuous full-duration scene: everything accumulates,
         nothing exits, so there is never a blank frame between beats */
      .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        box-sizing: border-box;
      }

      /* ---------------- eyebrow ---------------- */
      .eyebrow {
        position: absolute;
        top: 132px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        font-size: 32px;
        color: var(--accent);
        opacity: 0;
      }

      /* ---------------- ring diagram ---------------- */
      .ring-wrap {
        position: absolute;
        left: 730px;
        top: 330px;
        width: 460px;
        height: 460px;
      }
      .ring-svg {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .ring-track,
      .ring-progress {
        fill: none;
        stroke-linecap: round;
      }
      .ring-track {
        stroke: rgba(245, 241, 230, 0.12);
        stroke-width: 8;
        opacity: 0;
      }
      .ring-progress {
        stroke: var(--accent);
        stroke-width: 10;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        opacity: 0;
      }
      .ring-glow-pulse {
        position: absolute;
        inset: -40px;
        border-radius: 50%;
        box-shadow: 0 0 0px rgba(244, 217, 152, 0);
        pointer-events: none;
      }
      .marker-pivot {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        transform: rotate(0deg);
      }
      .marker-dot {
        position: absolute;
        top: -7px;
        left: 50%;
        width: 26px;
        height: 26px;
        margin-left: -13px;
        border-radius: 50%;
        background: var(--accent-bright);
        box-shadow: 0 0 24px rgba(244, 217, 152, 0.85);
        opacity: 0;
      }

      /* ---------------- node columns ---------------- */
      .node-col {
        position: absolute;
        top: 330px;
        width: 480px;
        height: 460px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
      }
      #node1 {
        left: 140px;
      }
      #node2 {
        left: 1300px;
      }
      .node-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--bg);
        font-size: 40px;
        font-weight: 800;
        line-height: 1;
        opacity: 0;
      }
      .node-label {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 30px;
        color: var(--muted);
        opacity: 0;
      }
      .node-arrow {
        font-family: "Montserrat", sans-serif;
        font-size: 40px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
        opacity: 0;
      }
      .node-emphasis {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 38px;
        line-height: 1.15;
        color: var(--accent-bright);
        opacity: 0;
      }

      /* ---------------- closing caption ---------------- */
      .closing-caption {
        position: absolute;
        top: 892px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 84px;
        line-height: 1;
        color: var(--text);
        opacity: 0;
      }
      .closing-caption .em {
        color: var(--accent-bright);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-flyw" id="stage" data-composition-id="demand-reputation-flywheel" data-start="0" data-duration="11.5" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-bg01" id="bg-fill"></div>

      <!-- ============ single continuous scene (0 - 11.5s) ============ -->
      <div data-hf-id="hf-scn1" id="scene-main" class="clip scene" data-start="0" data-duration="11.5" data-track-index="0">
        <div data-hf-id="hf-eyeb" class="eyebrow" id="eyebrow">A SYSTEM THAT ADAPTS</div>

        <!-- ring diagram -->
        <div data-hf-id="hf-ring" class="ring-wrap" id="ring-wrap">
          <svg data-hf-id="hf-rsvg" class="ring-svg" id="ring-svg" viewBox="0 0 460 460">
            <circle data-hf-id="hf-rtrk" class="ring-track" id="ring-track" cx="230" cy="230" r="212"></circle>
            <circle data-hf-id="hf-rprg" class="ring-progress" id="ring-progress" cx="230" cy="230" r="212"></circle>
          </svg>
          <div data-hf-id="hf-rglw" class="ring-glow-pulse" id="ring-glow-pulse"></div>
          <div data-hf-id="hf-mpiv" class="marker-pivot" id="marker-pivot">
            <div data-hf-id="hf-mdot" class="marker-dot" id="marker-dot"></div>
          </div>
        </div>

        <!-- node 1 · need opportunities -->
        <div data-hf-id="hf-nod1" class="node-col" id="node1">
          <div data-hf-id="hf-ic01" class="node-icon" id="icon1">&#8599;</div>
          <div data-hf-id="hf-lb01" class="node-label" id="label1">NEED OPPORTUNITIES</div>
          <div data-hf-id="hf-ar01" class="node-arrow" id="arrow1">&#8595;</div>
          <div data-hf-id="hf-em01" class="node-emphasis" id="emphasis1">SYSTEM CREATES DEMAND</div>
        </div>

        <!-- node 2 · fully booked -->
        <div data-hf-id="hf-nod2" class="node-col" id="node2">
          <div data-hf-id="hf-ic02" class="node-icon" id="icon2">&#10003;</div>
          <div data-hf-id="hf-lb02" class="node-label" id="label2">FULLY BOOKED</div>
          <div data-hf-id="hf-ar02" class="node-arrow" id="arrow2">&#8595;</div>
          <div data-hf-id="hf-em02" class="node-emphasis" id="emphasis2">SYSTEM BUILDS REPUTATION</div>
        </div>

        <!-- closing caption -->
        <div data-hf-id="hf-clos" class="closing-caption" id="closing-caption">GROWTH THAT <span data-hf-id="hf-clem" class="em">NEVER RESETS</span>.</div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var RADIUS = 212;
        var CIRC = 2 * Math.PI * RADIUS;

        var ringProgress = document.getElementById("ring-progress");
        ringProgress.style.strokeDasharray = CIRC;
        ringProgress.style.strokeDashoffset = CIRC;

        var tl = gsap.timeline({ paused: true });

        /* ================= beat 0 · scene fill (0 - 1.5s) ================= */
        tl.fromTo("#bg-fill", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.1);

        /* ================= beat 1 · eyebrow (0 - 1.5s) ================= */
        tl.fromTo(
          "#eyebrow",
          { opacity: 0, y: -24 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.2,
        );
        tl.fromTo(
          "#ring-track",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power1.out" },
          0.4,
        );

        /* ================= ring sweep + traveling marker (1.6 - 8.7s) =================
           one shared proxy value drives both the SVG stroke-dashoffset and the
           marker's pivot rotation, so the dot is always exactly at the arc's
           leading tip with no hand-tuned angle bookkeeping. */
        tl.fromTo(
          "#ring-progress",
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          1.6,
        );
        tl.fromTo(
          "#marker-dot",
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          1.6,
        );

        var ring = { v: 0 };
        tl.fromTo(
          ring,
          { v: 0 },
          {
            v: 1,
            duration: 7.1,
            ease: "power1.inOut",
            immediateRender: false,
            onUpdate: function () {
              ringProgress.style.strokeDashoffset = CIRC * (1 - ring.v);
              gsap.set("#marker-pivot", { rotation: ring.v * 360 });
            },
          },
          1.6,
        );

        /* ================= beat 2 · state 1 · need opportunities (1.5 - 5.0s) ================= */
        tl.fromTo(
          "#icon1",
          { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" },
          1.7,
        );
        tl.fromTo(
          "#label1",
          { opacity: 0, x: -30 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
          1.85,
        );
        tl.fromTo(
          "#arrow1",
          { opacity: 0, y: -10 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          2.1,
        );
        tl.fromTo(
          "#emphasis1",
          { opacity: 0, x: -30 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
          2.3,
        );
        tl.fromTo(
          "#emphasis1",
          { textShadow: "0 0 0px rgba(244,217,152,0)" },
          {
            textShadow: "0 0 30px rgba(244,217,152,0.8)",
            duration: 0.35,
            yoyo: true,
            repeat: 1,
            ease: "sine.inOut",
            immediateRender: false,
          },
          2.75,
        );

        /* ================= beat 3 · state 2 · fully booked (5.0 - 8.5s) ================= */
        tl.fromTo(
          "#icon2",
          { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" },
          5.1,
        );
        tl.fromTo(
          "#label2",
          { opacity: 0, x: 30 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
          5.25,
        );
        tl.fromTo(
          "#arrow2",
          { opacity: 0, y: -10 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          5.5,
        );
        tl.fromTo(
          "#emphasis2",
          { opacity: 0, x: 30 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
          5.7,
        );
        tl.fromTo(
          "#emphasis2",
          { textShadow: "0 0 0px rgba(244,217,152,0)" },
          {
            textShadow: "0 0 30px rgba(244,217,152,0.8)",
            duration: 0.35,
            yoyo: true,
            repeat: 1,
            ease: "sine.inOut",
            immediateRender: false,
          },
          6.15,
        );

        /* ================= beat 4 · closing (8.5 - 11.5s) ================= */
        // loop-complete glow pulse right as the ring finishes closing (~8.7s)
        tl.fromTo(
          "#ring-glow-pulse",
          { boxShadow: "0 0 0px rgba(244,217,152,0)" },
          {
            boxShadow: "0 0 70px rgba(244,217,152,0.55)",
            duration: 0.4,
            yoyo: true,
            repeat: 1,
            ease: "sine.inOut",
            immediateRender: false,
          },
          8.6,
        );
        tl.fromTo(
          "#closing-caption",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          9.0,
        );

        // freeze-hold from ~9.6s to the end (11.5s) for a clean cut back to host
        // footage — no further tweens scheduled; the last state simply persists.

        window.__timelines["demand-reputation-flywheel"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
