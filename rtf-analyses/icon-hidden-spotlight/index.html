<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Icon Hidden Spotlight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d0817;
        --bg2: #1b1130;
        --accent: #9b5cff;
        --accent-bright: #c9a8ff;
        --text: #f3effa;
        --muted: #9088a8;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", ui-sans-serif, sans-serif;
      }

      /* full-bleed background: fades in once at the very start and never
         fades out again, so no frame of the alpha-overlay export is ever
         fully transparent (a persistent replacement of host footage) */
      #bg-fill {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(120% 120% at 50% 42%, var(--bg2) 0%, var(--bg) 62%);
        opacity: 0;
      }

      /* single continuous full-duration scene: dim icon -> spotlight sweep ->
         label all accumulate in one clip, nothing exits, so the frame is
         never empty between beats */
      .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        gap: 56px;
        box-sizing: border-box;
      }

      /* ---------------- spotlight beam (sweeps in, lands on the icon) ---------------- */
      /* apex fixed at x=960 (the icon's horizontal center), off the top edge;
         rotating around that fixed apex sweeps the whole cone like a
         flashlight anchored at a single point */
      #beam {
        position: absolute;
        top: -220px;
        left: 960px;
        width: 1500px;
        height: 1500px;
        transform: translateX(-50%) rotate(-32deg);
        transform-origin: 50% 0%;
        clip-path: polygon(48% 0%, 20% 100%, 80% 100%);
        background: linear-gradient(to bottom, rgba(201, 168, 255, 0.6) 0%, rgba(201, 168, 255, 0.16) 55%, rgba(201, 168, 255, 0) 82%);
        opacity: 0;
        z-index: 1;
        pointer-events: none;
      }

      /* ---------------- icon (dim -> illuminated) ---------------- */
      .icon-stack {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 460px;
        height: 460px;
        flex: none;
        z-index: 2;
      }
      #icon-glow {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(closest-side, var(--accent-bright) 0%, transparent 72%);
        opacity: 0;
        pointer-events: none;
      }
      #icon-wrap {
        position: relative;
        width: 320px;
        height: 320px;
        color: var(--muted);
        opacity: 0;
        filter: drop-shadow(0 0 0px rgba(201, 168, 255, 0));
      }
      #icon-wrap svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #icon-wrap path,
      #icon-wrap rect,
      #icon-wrap line {
        fill: none;
        stroke: currentColor;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------------- label (resolves beneath the lit icon) ---------------- */
      .label-wrap {
        position: relative;
        z-index: 2;
      }
      #label {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 96px;
        line-height: 1;
        color: var(--text);
        text-align: center;
        white-space: nowrap;
        opacity: 0;
      }
      #label .em {
        color: var(--accent-bright);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="icon-hidden-spotlight" data-start="0" data-duration="5.0" data-fps="30" data-width="1920" data-height="1080">
      <div id="bg-fill"></div>

      <!-- ============ single continuous scene (0 - 5.0s) ============ -->
      <div id="scene-main" class="clip scene" data-start="0" data-duration="5.0" data-track-index="0">
        <div id="beam"></div>

        <div class="icon-stack" id="icon-stack">
          <div id="icon-glow"></div>
          <div id="icon-wrap">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <!-- awning / roofline -->
              <line x1="16" y1="58" x2="184" y2="58" />
              <!-- building body -->
              <rect x="35" y="58" width="130" height="126" rx="3" />
              <!-- door -->
              <rect x="88" y="128" width="24" height="56" />
              <!-- windows -->
              <rect x="55" y="85" width="27" height="27" />
              <rect x="118" y="85" width="27" height="27" />
            </svg>
          </div>
        </div>

        <div class="label-wrap">
          <div id="label">SEEN AT LAST.</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });

        /* ================= persistent background (0 - 0.15s) ================= */
        tl.fromTo("#bg-fill", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.0);

        /* ================= beat 1 · dim, easy-to-miss icon (0.1 - 1.5s) ================= */
        gsap.set("#icon-wrap", { transformOrigin: "50% 50%" });
        tl.fromTo(
          "#icon-wrap",
          { opacity: 0, scale: 0.78 },
          { opacity: 0.55, scale: 0.82, duration: 0.6, ease: "power2.out" },
          0.2,
        );
        // hold dim from ~0.8s to 1.5s — no tween scheduled, state persists

        /* ================= beat 2 · spotlight sweeps in and lands (1.5 - 3.0s) ================= */
        tl.fromTo("#beam", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.5);
        tl.fromTo(
          "#beam",
          { rotate: -32 },
          { rotate: 0, duration: 1.1, ease: "power2.inOut", immediateRender: false },
          1.5,
        );

        // icon brightens right as the beam lands (~2.3s)
        tl.fromTo(
          "#icon-wrap",
          { opacity: 0.55, scale: 0.82, color: "#9088a8" },
          { opacity: 1, scale: 1.0, color: "#c9a8ff", duration: 0.5, ease: "back.out(1.8)", immediateRender: false },
          2.3,
        );
        tl.fromTo(
          "#icon-wrap",
          { filter: "drop-shadow(0 0 0px rgba(201,168,255,0))" },
          { filter: "drop-shadow(0 0 32px rgba(201,168,255,0.85))", duration: 0.5, ease: "power2.out", immediateRender: false },
          2.3,
        );
        tl.fromTo(
          "#icon-glow",
          { opacity: 0, scale: 0.6 },
          { opacity: 0.65, scale: 1.0, duration: 0.55, ease: "power2.out" },
          2.3,
        );

        // beam settles from full sweep brightness down to a lower ambient
        // hold once it has landed — it stays lit rather than exiting, so the
        // icon reads as continuously illuminated for the rest of the piece
        tl.to("#beam", { opacity: 0.32, duration: 0.4, ease: "power1.inOut" }, 2.6);

        /* ================= beat 3 · label resolves (3.0 - 5.0s, freeze-hold to end) ================= */
        tl.fromTo(
          "#label",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          3.0,
        );
        tl.fromTo(
          "#label",
          { textShadow: "0 0 0px rgba(201,168,255,0)" },
          {
            textShadow: "0 0 40px rgba(201,168,255,0.7)",
            duration: 0.35,
            yoyo: true,
            repeat: 1,
            ease: "sine.inOut",
            immediateRender: false,
          },
          3.4,
        );

        // freeze-hold from ~4.5s to the end (5.0s) for a clean cut — no
        // further tweens scheduled; the last state simply persists.

        window.__timelines["icon-hidden-spotlight"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
