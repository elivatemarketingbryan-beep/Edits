<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Revenue Math Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0a08;
        --bg2: #17140f;
        --accent: #d9a94a;
        --accent-bright: #f4d998;
        --text: #f5f1e6;
        --muted: #9c9384;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", ui-sans-serif, sans-serif;
      }

      /* full-bleed background fill: transparent until the hook lands, then
         opaque near-black for the rest of the piece (alpha-overlay export) */
      #bg-fill {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(120% 120% at 50% 42%, var(--bg2) 0%, var(--bg) 62%);
        opacity: 0;
      }

      .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        box-sizing: border-box;
      }

      .stat-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1500px;
        height: 950px;
        transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, var(--accent) 0%, transparent 70%);
        opacity: 0;
        pointer-events: none;
        z-index: -1;
      }

      /* ---------------- scene 1 · goal number ($500,000 / year) ---------------- */
      .stat-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        text-align: center;
      }
      .stat-eyebrow {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 30px;
        color: var(--muted);
        opacity: 0;
      }
      .stat-numeral {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        line-height: 1;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
        opacity: 0;
      }
      #card-goal .stat-numeral {
        font-size: 300px;
      }
      .stat-label {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        letter-spacing: 0.1em;
        font-size: 52px;
        color: var(--text);
        opacity: 0;
      }

      /* ---------------- scene 2 · divide transform (÷ 12 months) ---------------- */
      .divide-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 56px;
      }
      .divide-symbol {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        font-size: 260px;
        line-height: 1;
        color: var(--accent-bright);
        opacity: 0;
      }
      .divide-label {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 64px;
        color: var(--text);
        opacity: 0;
      }
      .divide-ticks {
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        justify-content: center;
        gap: 14px;
        height: 80px;
      }
      .divide-tick {
        width: 34px;
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(180deg, var(--accent-bright) 0%, var(--accent) 100%);
        transform-origin: bottom center;
        transform: scaleY(0);
      }

      /* ---------------- scene 3 · hero number ($41K-$42K / month) ---------------- */
      .hero-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        text-align: center;
      }
      .hero-numeral-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
      }
      .hero-numeral {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        line-height: 1;
        font-size: 360px;
        color: var(--accent-bright);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
        opacity: 0;
      }
      .hero-numeral-ext {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        line-height: 1;
        font-size: 200px;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
        opacity: 0;
        margin-left: 24px;
      }
      .hero-closing {
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 40px;
        letter-spacing: 0.01em;
        color: var(--muted);
        max-width: 1400px;
        opacity: 0;
      }
      .hero-closing .em {
        color: var(--accent-bright);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-9dor" id="stage" data-composition-id="revenue-math-reveal" data-start="0" data-duration="10" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-02i2" id="bg-fill"></div>

      <!-- ============ scene 1 · goal number (0.0 - 3.0s) ============ -->
      <div data-hf-id="hf-rxy5" id="scene-goal" class="clip scene" data-start="0" data-duration="3.0" data-track-index="0">
        <div data-hf-id="hf-otc3" class="stat-card" id="card-goal">
          <div data-hf-id="hf-auzc" class="stat-glow" id="glow-goal" data-layout-allow-overflow="true"></div>
          <div data-hf-id="hf-wrjy" class="stat-numeral" id="val-goal">$0</div>
          <div data-hf-id="hf-ixzr" class="stat-label" id="label-goal">PER YEAR</div>
        </div>
      </div>

      <!-- ============ scene 2 · divide transform (3.0 - 4.3s) ============ -->
      <div data-hf-id="hf-0ocd" id="scene-divide" class="clip scene" data-start="3.0" data-duration="1.3" data-track-index="0">
        <div data-hf-id="hf-a9vc" class="divide-card" id="card-divide">
          <div data-hf-id="hf-qhlz" class="divide-symbol" id="divide-symbol">÷</div>
          <div data-hf-id="hf-v4b0" class="divide-label" id="divide-label">12 MONTHS</div>
          <div data-hf-id="hf-f14i" class="divide-ticks" id="divide-ticks">
            <div data-hf-id="hf-n6vt" class="divide-tick" id="tick-0"></div>
            <div data-hf-id="hf-mf80" class="divide-tick" id="tick-1"></div>
            <div data-hf-id="hf-xapn" class="divide-tick" id="tick-2"></div>
            <div data-hf-id="hf-r4zu" class="divide-tick" id="tick-3"></div>
            <div data-hf-id="hf-akvx" class="divide-tick" id="tick-4"></div>
            <div data-hf-id="hf-9t84" class="divide-tick" id="tick-5"></div>
            <div data-hf-id="hf-ih3z" class="divide-tick" id="tick-6"></div>
            <div data-hf-id="hf-eizy" class="divide-tick" id="tick-7"></div>
            <div data-hf-id="hf-emhd" class="divide-tick" id="tick-8"></div>
            <div data-hf-id="hf-dutk" class="divide-tick" id="tick-9"></div>
            <div data-hf-id="hf-5jyw" class="divide-tick" id="tick-10"></div>
            <div data-hf-id="hf-6bmp" class="divide-tick" id="tick-11"></div>
          </div>
        </div>
      </div>

      <!-- ============ scene 3 · hero number (4.3 - 10.0s) ============ -->
      <div data-hf-id="hf-m9ji" id="scene-hero" class="clip scene" data-start="4.3" data-duration="5.7" data-track-index="0">
        <div data-hf-id="hf-m464" class="hero-card" id="card-hero">
          <div data-hf-id="hf-9jl4" class="stat-glow" id="glow-hero" data-layout-allow-overflow="true" style="width: 1700px; height: 1050px;"></div>
          <div data-hf-id="hf-xvt6" class="hero-numeral-row">
            <div data-hf-id="hf-72rh" class="hero-numeral" id="val-hero">$0</div>
            <div data-hf-id="hf-u7mv" class="hero-numeral-ext" id="ext-hero">–$42K</div>
          </div>
          <div data-hf-id="hf-w9xf" class="stat-label" id="label-hero">PER MONTH</div>
          <div data-hf-id="hf-rf2z" class="hero-closing" id="closing-hero">
            THAT'S JUST A <span data-hf-id="hf-me20" class="em">FEW STRONG PROJECTS</span> A MONTH
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        function formatMoney(n) {
          n = Math.round(n);
          var neg = n < 0;
          var s = String(Math.abs(n));
          var out = "";
          for (var i = 0; i < s.length; i++) {
            if (i > 0 && (s.length - i) % 3 === 0) out += ",";
            out += s[i];
          }
          return (neg ? "-" : "") + "$" + out;
        }

        var tl = gsap.timeline({ paused: true });

        /* ================= scene 1 · goal number (0.0 - 3.0s) ================= */
        tl.fromTo("#bg-fill", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.1);

        tl.fromTo("#glow-goal", { opacity: 0 }, { opacity: 0.4, duration: 0.5, ease: "power2.out" }, 0.15);
        tl.fromTo(
          "#val-goal",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)" },
          0.2,
        );

        var stGoal = { v: 0 };
        tl.fromTo(
          stGoal,
          { v: 0 },
          {
            v: 500000,
            duration: 1.0,
            ease: "power2.out",
            immediateRender: false,
            onUpdate: function () {
              document.getElementById("val-goal").textContent = formatMoney(stGoal.v);
            },
          },
          0.25,
        );

        tl.fromTo(
          "#label-goal",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          1.4,
        );

        /* ================= scene 2 · divide transform (3.0 - 4.3s) ================= */
        tl.fromTo(
          "#divide-symbol",
          { scale: 0.5, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2.2)" },
          3.0,
        );
        tl.fromTo(
          "#divide-label",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          3.15,
        );

        for (var ti = 0; ti < 12; ti++) {
          tl.fromTo(
            "#tick-" + ti,
            { scaleY: 0 },
            { scaleY: 1, duration: 0.15, ease: "back.out(2.0)" },
            3.3 + ti * 0.03,
          );
        }

        /* ================= scene 3 · hero number (4.3 - 10.0s) ================= */
        tl.fromTo("#glow-hero", { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, 4.3);
        tl.fromTo(
          "#val-hero",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.4)" },
          4.3,
        );

        var stHero = { v: 0 };
        tl.fromTo(
          stHero,
          { v: 0 },
          {
            v: 41,
            duration: 1.1,
            ease: "power2.out",
            immediateRender: false,
            onUpdate: function () {
              document.getElementById("val-hero").textContent = "$" + Math.round(stHero.v) + "K";
            },
          },
          4.5,
        );

        tl.fromTo(
          "#ext-hero",
          { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
          5.6,
        );

        // glow pulse on landing — marks the biggest/boldest moment
        gsap.set("#val-hero", { transformOrigin: "50% 50%" });
        tl.fromTo(
          "#val-hero",
          { textShadow: "0 0 0px rgba(244,217,152,0)" },
          {
            textShadow: "0 0 60px rgba(244,217,152,0.85)",
            duration: 0.3,
            yoyo: true,
            repeat: 1,
            ease: "sine.inOut",
            immediateRender: false,
          },
          5.6,
        );

        tl.fromTo(
          "#label-hero",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          5.9,
        );

        tl.fromTo(
          "#closing-hero",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          6.6,
        );

        // freeze-hold from ~7.1s to the end (10.0s) for a clean cut back to host footage —
        // no further tweens scheduled; the last state simply persists.

        window.__timelines["revenue-math-reveal"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
