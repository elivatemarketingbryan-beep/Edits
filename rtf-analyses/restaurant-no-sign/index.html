<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Restaurant No Sign</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d0817;
        --bg2: #1b1130;
        --accent: #9b5cff;
        --accent-bright: #c9a8ff;
        --text: #f3effa;
        --muted: #9088a8;
        --negative: #b5675c;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", ui-sans-serif, sans-serif;
      }

      /* full-bleed background: fades in with the hook and never fades out
         again, so no scene boundary ever exposes a fully transparent frame
         (alpha-overlay export plays as a full replacement of host footage) */
      #bg-fill {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(120% 120% at 50% 42%, var(--bg2) 0%, var(--bg) 62%);
        opacity: 0;
      }

      .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        box-sizing: border-box;
      }

      /* ---------------- scene 1 · hook (0.0 - 2.6s) ---------------- */
      .hook-text {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        font-size: 128px;
        line-height: 1.08;
        color: var(--text);
        text-align: center;
        opacity: 0;
      }
      .hook-text .em {
        color: var(--accent-bright);
      }

      /* ---------------- scene 2 · positive list (2.2 - 5.6s) ---------------- */
      .positive-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 40px;
        opacity: 1;
      }
      .pos-row {
        display: flex;
        align-items: center;
        gap: 30px;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 54px;
        color: var(--text);
        opacity: 0;
      }
      .pos-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--bg);
        font-size: 32px;
        font-weight: 800;
        flex: none;
        box-shadow: 0 0 34px rgba(155, 92, 255, 0.45);
      }

      /* ---------------- scene 3 · the twist: storefront + negatives (5.2 - 10.1s) ---------------- */
      .twist-wrap {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 130px;
        opacity: 1;
      }
      #storefront-svg {
        width: 460px;
        height: 460px;
        flex: none;
        opacity: 0;
        display: block;
      }
      #storefront-svg rect {
        stroke: var(--muted);
        stroke-width: 5;
      }
      .negative-list {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 38px;
      }
      .neg-row {
        display: flex;
        align-items: center;
        gap: 28px;
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 46px;
        color: var(--muted);
        opacity: 0;
      }
      .neg-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(181, 103, 92, 0.12);
        border: 2px solid rgba(181, 103, 92, 0.55);
        color: var(--negative);
        font-size: 26px;
        font-weight: 800;
        flex: none;
      }

      /* ---------------- scene 4 · payoff (9.7 - 13.0s) ---------------- */
      .payoff-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }
      .payoff-line {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        font-size: 104px;
        line-height: 1.05;
        color: var(--text);
        text-align: center;
        opacity: 0;
      }
      .payoff-line .em {
        color: var(--accent-bright);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="restaurant-no-sign"
      data-start="0"
      data-duration="13.0"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg-fill"></div>

      <!-- ============ scene 1 · hook (0.0 - 2.6s) ============ -->
      <div id="scene-hook" class="clip scene" data-start="0" data-duration="2.6" data-track-index="0">
        <div class="hook-text" id="hook-text" data-layout-allow-overlap="true">
          THE <span class="em">BEST</span> RESTAURANT<br />IN TOWN.
        </div>
      </div>

      <!-- ============ scene 2 · positive stagger list (2.2 - 5.6s) ============ -->
      <div id="scene-positive" class="clip scene" data-start="2.2" data-duration="3.4" data-track-index="0">
        <div class="positive-wrap" id="positive-wrap">
          <div class="pos-row" id="pos-0" data-layout-allow-overlap="true"><span class="pos-mark">&#10003;</span>Incredible food</div>
          <div class="pos-row" id="pos-1"><span class="pos-mark">&#10003;</span>Every customer leaves happy</div>
          <div class="pos-row" id="pos-2"><span class="pos-mark">&#10003;</span>People rave about it</div>
        </div>
      </div>

      <!-- ============ scene 3 · the twist: storefront + negatives (5.2 - 10.1s) ============ -->
      <div id="scene-twist" class="clip scene" data-start="5.2" data-duration="4.9" data-track-index="0">
        <div class="twist-wrap" id="twist-wrap">
          <svg id="storefront-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="70" width="260" height="20" fill="rgba(27,17,48,0.5)" />
            <rect x="40" y="90" width="220" height="180" fill="rgba(27,17,48,0.5)" />
            <rect x="70" y="120" width="50" height="50" fill="#0d0817" />
            <rect x="180" y="120" width="50" height="50" fill="#0d0817" />
            <rect x="130" y="190" width="40" height="80" fill="#0d0817" />
          </svg>
          <div class="negative-list" id="negative-list">
            <div class="neg-row" id="neg-0" data-layout-allow-overlap="true"><span class="neg-mark">&#10005;</span>No Sign Outside</div>
            <div class="neg-row" id="neg-1" data-layout-allow-overlap="true"><span class="neg-mark">&#10005;</span>No Website</div>
            <div class="neg-row" id="neg-2"><span class="neg-mark">&#10005;</span>No Reviews</div>
          </div>
        </div>
      </div>

      <!-- ============ scene 4 · payoff (9.7 - 13.0s) ============ -->
      <div id="scene-payoff" class="clip scene" data-start="9.7" data-duration="3.3" data-track-index="0">
        <div class="payoff-wrap">
          <div class="payoff-line" id="payoff-line-1" data-layout-allow-overlap="true">IT'S NOT A QUALITY PROBLEM.</div>
          <div class="payoff-line" id="payoff-line-2">IT'S A <span class="em" id="visibility-word">VISIBILITY</span> PROBLEM.</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });

        /* ================= persistent background ================= */
        tl.fromTo("#bg-fill", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.05);

        /* ================= scene 1 · hook (0.0 - 2.6s) ================= */
        // slam entrance
        tl.fromTo(
          "#hook-text",
          { y: -260, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
          0.1,
        );
        // small landing shake
        gsap.set("#hook-text", { transformOrigin: "50% 50%" });
        tl.fromTo("#hook-text", { x: 0 }, { x: -8, duration: 0.05, ease: "none", immediateRender: false }, 0.55)
          .fromTo("#hook-text", { x: -8 }, { x: 8, duration: 0.06, ease: "none", immediateRender: false }, 0.61)
          .fromTo("#hook-text", { x: 8 }, { x: 0, duration: 0.06, ease: "none", immediateRender: false }, 0.68);

        // hold, then lift + fade the hook out — crossfading under the positive
        // list scene (starts entering at 2.2s), so the frame is never without
        // visible content
        tl.fromTo(
          "#hook-text",
          { opacity: 1, y: 0 },
          { opacity: 0, y: -24, duration: 0.45, ease: "power2.in", immediateRender: false },
          2.05,
        );

        /* ================= scene 2 · positive stagger list (2.2 - 5.6s) ================= */
        var posStarts = [2.3, 2.75, 3.2];
        for (var pi = 0; pi < 3; pi++) {
          tl.fromTo(
            "#pos-" + pi,
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            posStarts[pi],
          );
        }

        // hold, then lift + fade the whole positive list out — crossfading
        // under the twist scene (storefront starts entering at 5.25s)
        tl.fromTo(
          "#positive-wrap",
          { opacity: 1, y: 0 },
          { opacity: 0, y: -24, duration: 0.45, ease: "power2.in", immediateRender: false },
          5.05,
        );

        /* ================= scene 3 · the twist (5.2 - 10.1s) ================= */
        tl.fromTo(
          "#storefront-svg",
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
          5.25,
        );

        var negStarts = [6.2, 7.2, 8.2];
        for (var ni = 0; ni < 3; ni++) {
          tl.fromTo(
            "#neg-" + ni,
            { opacity: 0, y: 20 },
            { opacity: 0.92, y: 0, duration: 0.4, ease: "power2.out" },
            negStarts[ni],
          );
        }

        // hold, then lift + fade the whole twist scene out — crossfading
        // under the payoff scene (starts entering at 9.8s)
        tl.fromTo(
          "#twist-wrap",
          { opacity: 1, y: 0 },
          { opacity: 0, y: -24, duration: 0.45, ease: "power2.in", immediateRender: false },
          9.55,
        );

        /* ================= scene 4 · payoff (9.7 - 13.0s, freeze-hold to end) ================= */
        tl.fromTo(
          "#payoff-line-1",
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" },
          9.8,
        );
        tl.fromTo(
          "#payoff-line-2",
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" },
          10.5,
        );

        gsap.set("#visibility-word", { transformOrigin: "50% 50%" });
        tl.fromTo(
          "#visibility-word",
          { textShadow: "0 0 0px rgba(201,168,255,0)" },
          {
            textShadow: "0 0 60px rgba(201,168,255,0.85)",
            duration: 0.35,
            yoyo: true,
            repeat: 1,
            ease: "sine.inOut",
            immediateRender: false,
          },
          11.0,
        );

        // freeze-hold from ~11.7s to the end (13.0s) for a clean cut back to
        // host footage — no further tweens scheduled; the last state persists.

        window.__timelines["restaurant-no-sign"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
