<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Icon CTA Buttons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d0817;
        --bg2: #1b1130;
        --accent: #9b5cff;
        --accent-bright: #c9a8ff;
        --text: #f3effa;
        --muted: #9088a8;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", ui-sans-serif, sans-serif;
      }

      /* full-bleed background fill: transparent until the hook lands, then
         opaque near-black for the rest of the piece (alpha-overlay export;
         persistent — fades in once, never fades out, so the frame is never
         blank mid-piece) */
      #bg-fill {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(120% 120% at 50% 46%, var(--bg2) 0%, var(--bg) 62%);
        opacity: 0;
      }

      /* single continuous full-duration scene: nothing exits before the
         freeze-hold, so there is never a blank frame between beats */
      .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        box-sizing: border-box;
      }

      .scene-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 64px;
        width: 100%;
        height: 100%;
      }

      /* ---------------- icon button row ---------------- */
      .icon-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 96px;
      }

      .icon-btn {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        opacity: 0;
      }

      .icon-chassis {
        position: relative;
        width: 220px;
        height: 220px;
        border-radius: 40px;
        background: var(--bg2);
        border: 3px solid rgba(155, 92, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0px rgba(155, 92, 255, 0);
      }

      .icon-chassis svg {
        width: 50%;
        height: 50%;
        overflow: visible;
        /* SVG <use> only inherits currentColor-style properties from this
           ancestor into its shadow content — a descendant selector like
           "svg path" cannot reach inside a <use> instance. The glyph paths
           carry stroke="currentColor"/fill="currentColor" attributes
           directly, so setting `color` here is what actually colors them. */
        color: var(--accent-bright);
      }

      .icon-glow-pulse {
        position: absolute;
        inset: -20px;
        border-radius: 52px;
        box-shadow: 0 0 0px rgba(201, 168, 255, 0);
        pointer-events: none;
      }

      .icon-caption {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 30px;
        color: var(--muted);
      }

      /* ---------------- closing label ---------------- */
      .cta-label {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 90px;
        line-height: 1;
        color: var(--text);
        text-align: center;
        opacity: 0;
      }
      .cta-label .em {
        color: var(--accent-bright);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <!-- phone handset — line-art glyph -->
        <symbol id="icon-phone-glyph" viewBox="0 0 24 24">
          <path
            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <!-- quote / document with lines — line-art glyph -->
        <symbol id="icon-quote-glyph" viewBox="0 0 24 24">
          <path
            d="M6 2.5h9l4 4V21a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M15 2.5V6a1 1 0 0 0 1 1h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M8 15.4h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M8 18.8h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </symbol>
        <!-- chat bubble with dots — line-art glyph -->
        <symbol id="icon-chat-glyph" viewBox="0 0 24 24">
          <path
            d="M21 11.5a8 8 0 0 1-8.4 8.49 8.1 8.1 0 0 1-3.13-.62L3 21l1.8-5.4A8 8 0 1 1 21 11.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="8.5" cy="11.5" r="0.9" fill="currentColor" stroke="none" />
          <circle cx="12" cy="11.5" r="0.9" fill="currentColor" stroke="none" />
          <circle cx="15.5" cy="11.5" r="0.9" fill="currentColor" stroke="none" />
        </symbol>
      </defs>
    </svg>

    <div
      id="stage"
      data-composition-id="icon-cta-buttons"
      data-start="0"
      data-duration="6"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg-fill"></div>

      <!-- ============ single continuous scene (0 - 6.0s) ============ -->
      <div id="scene-main" class="clip scene" data-start="0" data-duration="6" data-track-index="0">
        <div class="scene-content">
          <div class="icon-row" id="icon-row">
            <div class="icon-btn" id="btn-phone">
              <div class="icon-chassis" id="chassis-phone">
                <div class="icon-glow-pulse" id="glow-phone" data-layout-allow-overflow="true"></div>
                <svg viewBox="0 0 24 24"><use href="#icon-phone-glyph"></use></svg>
              </div>
              <div class="icon-caption">Call</div>
            </div>
            <div class="icon-btn" id="btn-quote">
              <div class="icon-chassis" id="chassis-quote">
                <div class="icon-glow-pulse" id="glow-quote" data-layout-allow-overflow="true"></div>
                <svg viewBox="0 0 24 24"><use href="#icon-quote-glyph"></use></svg>
              </div>
              <div class="icon-caption">Quote</div>
            </div>
            <div class="icon-btn" id="btn-chat">
              <div class="icon-chassis" id="chassis-chat">
                <div class="icon-glow-pulse" id="glow-chat" data-layout-allow-overflow="true"></div>
                <svg viewBox="0 0 24 24"><use href="#icon-chat-glyph"></use></svg>
              </div>
              <div class="icon-caption">Chat</div>
            </div>
          </div>

          <div class="cta-label" id="cta-label">MULTIPLE WAYS TO SAY <span class="em">YES.</span></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });

        /* ================= beat 1 · scene fill (0 - 1.0s) ================= */
        tl.fromTo("#bg-fill", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.1);

        /* ================= beat 2 · icon buttons activate, staggered left-to-right (1.0 - 3.6s) =================
           each icon pops in (scale_punch / back.out) then, on landing, fires a
           glow-pulse box-shadow burst on its chassis — a "button being pressed"
           activation moment. 0.55s stagger between icons. */
        var icons = [
          { btn: "#btn-phone", chassis: "#chassis-phone", glow: "#glow-phone", t: 1.0 },
          { btn: "#btn-quote", chassis: "#chassis-quote", glow: "#glow-quote", t: 1.55 },
          { btn: "#btn-chat", chassis: "#chassis-chat", glow: "#glow-chat", t: 2.1 },
        ];

        icons.forEach(function (icon) {
          tl.fromTo(
            icon.btn,
            { opacity: 0, scale: 0.55, y: 26 },
            { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(2.6)" },
            icon.t,
          );

          // landing glow-pulse "activation" burst, timed just as the pop settles
          tl.fromTo(
            icon.glow,
            { boxShadow: "0 0 0px rgba(201,168,255,0)" },
            {
              boxShadow: "0 0 64px rgba(201,168,255,0.85)",
              duration: 0.3,
              yoyo: true,
              repeat: 1,
              ease: "sine.inOut",
              immediateRender: false,
            },
            icon.t + 0.34,
          );

          // border brightens permanently once activated
          tl.fromTo(
            icon.chassis,
            { borderColor: "rgba(155,92,255,0.4)" },
            { borderColor: "rgba(201,168,255,0.9)", duration: 0.3, ease: "power1.out" },
            icon.t + 0.34,
          );
        });

        /* ================= beat 3 · closing label (3.6 - 5.0s) ================= */
        tl.fromTo(
          "#cta-label",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          3.6,
        );

        // freeze-hold from ~4.1s to the end (6.0s) for a clean cut — no further
        // tweens scheduled; the last state simply persists.

        window.__timelines["icon-cta-buttons"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
