<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>SEO Payoff Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0a08;
        --bg2: #17140f;
        --accent: #d9a94a;
        --accent-bright: #f4d998;
        --text: #f5f1e6;
        --muted: #9c9384;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", ui-sans-serif, sans-serif;
      }

      /* full-bleed background fill: transparent until the header lands, then
         opaque near-black for the rest of the piece (alpha-overlay export).
         It fades in early and is never removed, so the overlay never goes
         blank at any point in the timeline. */
      #bg-fill {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(120% 120% at 50% 40%, var(--bg2) 0%, var(--bg) 62%);
        opacity: 0;
      }

      /* single full-duration scene: everything below is purely additive
         (nothing is ever hidden/removed once shown), so there is no
         scene-switch moment and therefore no possible blank frame. */
      .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 96px 140px;
        box-sizing: border-box;
        gap: 56px;
      }

      /* ---------------- header (eyebrow + sub-label) ---------------- */
      .dashboard-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .eyebrow-wrap {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .eyebrow {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        font-size: 46px;
        color: var(--accent);
        opacity: 0;
        white-space: nowrap;
      }
      /* CSS-native sizing only: this bar's width comes from align-self:stretch
         against its inline-flex column ancestor (sized by the widest child,
         i.e. the eyebrow text itself). The browser recomputes this AFTER web
         fonts swap in, as part of ordinary layout -- there is no JS
         offsetWidth snapshot to go stale, so it can never overshoot or sit
         crooked relative to the text above it. */
      .eyebrow-underline {
        align-self: stretch;
        height: 4px;
        border-radius: 2px;
        background: var(--accent);
        transform-origin: center center;
        transform: scaleX(0);
      }
      .sub-label {
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: 28px;
        color: var(--muted);
        opacity: 0;
      }

      /* ---------------- dashboard row (two KPI tiles) ---------------- */
      .dashboard-row {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: center;
        gap: 84px;
      }
      .kpi-card {
        position: relative;
        width: 660px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 26px;
        text-align: center;
        padding: 64px 48px 56px;
        background: var(--bg2);
        border: 1px solid rgba(217, 169, 74, 0.32);
        border-radius: 32px;
        opacity: 0;
      }
      .kpi-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 900px;
        height: 700px;
        transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, var(--accent) 0%, transparent 70%);
        opacity: 0;
        pointer-events: none;
        z-index: -1;
      }
      .kpi-icon {
        width: 108px;
        height: 108px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(217, 169, 74, 0.14);
        border: 2px solid var(--accent);
        opacity: 0;
        flex: none;
      }
      .kpi-icon svg {
        width: 52px;
        height: 52px;
      }
      .kpi-numeral-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 8px;
      }
      .kpi-numeral {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        line-height: 1;
        font-size: 200px;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
        opacity: 0;
      }
      .kpi-suffix {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        line-height: 1;
        font-size: 128px;
        color: var(--accent-bright);
        font-variant-numeric: tabular-nums;
        opacity: 0;
      }
      .kpi-label {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 32px;
        color: var(--text);
        opacity: 0;
        max-width: 520px;
      }
      .kpi-track {
        position: relative;
        width: 440px;
        height: 7px;
        border-radius: 4px;
        background: rgba(245, 241, 230, 0.12);
        overflow: hidden;
      }
      .kpi-track-fill {
        position: absolute;
        inset: 0;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--accent) 0%, var(--accent-bright) 100%);
        transform-origin: left center;
        transform: scaleX(0);
      }

      /* ---------------- closing caption ---------------- */
      .dashboard-caption {
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 42px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        text-align: center;
        opacity: 0;
      }
      .dashboard-caption .em {
        color: var(--accent-bright);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-spd1" id="stage" data-composition-id="seo-payoff-dashboard" data-start="0" data-duration="11.5" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-spd2" id="bg-fill"></div>

      <!-- ============ single full-duration scene (0.0 - 11.5s) — additive build, no cuts ============ -->
      <div data-hf-id="hf-spd3" id="scene-main" class="clip scene" data-start="0" data-duration="11.5" data-track-index="0">

        <!-- header: eyebrow + sub-label (0.2 - 1.05s) -->
        <div data-hf-id="hf-spd4" class="dashboard-header" id="dashboard-header">
          <div data-hf-id="hf-spd5" class="eyebrow-wrap" id="eyebrow-wrap">
            <div data-hf-id="hf-spd6" class="eyebrow" id="eyebrow">ORGANIC SEO PAYOFF</div>
            <div data-hf-id="hf-spd7" class="eyebrow-underline" id="eyebrow-underline"></div>
          </div>
          <div data-hf-id="hf-spd8" class="sub-label" id="sub-label">ONCE MOMENTUM BUILDS</div>
        </div>

        <!-- dashboard row: two KPI tiles -->
        <div data-hf-id="hf-spd9" class="dashboard-row" id="dashboard-row">

          <!-- tile 1 · calls (enters ~1.5s) -->
          <div data-hf-id="hf-spd10" class="kpi-card" id="kpi-calls">
            <div data-hf-id="hf-spd11" class="kpi-glow" id="glow-calls" data-layout-allow-overflow="true"></div>
            <div data-hf-id="hf-spd12" class="kpi-icon" id="icon-calls">
              <svg data-hf-id="hf-spd13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path data-hf-id="hf-spd14" d="M7.1 3.3H4.8c-.8 0-1.5.7-1.4 1.5.5 4 2.2 7.7 4.9 10.7 2.7 2.9 6.2 4.8 10 5.4.8.1 1.6-.5 1.6-1.4v-2.3c0-.7-.5-1.3-1.2-1.4l-3-.6c-.6-.1-1.2.1-1.6.6l-.9 1c-2.3-1.2-4.2-3.2-5.5-5.6l1-1c.4-.4.6-1 .5-1.6l-.6-3.1c-.1-.7-.7-1.2-1.5-1.2z" stroke="#F4D998" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
              </svg>
            </div>
            <div data-hf-id="hf-spd15" class="kpi-numeral-row">
              <div data-hf-id="hf-spd16" class="kpi-numeral" id="val-calls">0</div>
              <div data-hf-id="hf-spd17" class="kpi-suffix" id="suffix-calls">-60</div>
            </div>
            <div data-hf-id="hf-spd18" class="kpi-track"><div data-hf-id="hf-spd19" class="kpi-track-fill" id="fill-calls"></div></div>
            <div data-hf-id="hf-spd20" class="kpi-label" id="label-calls">CALLS PER MONTH</div>
          </div>

          <!-- tile 2 · organic leads (enters ~3.5s) -->
          <div data-hf-id="hf-spd21" class="kpi-card" id="kpi-leads">
            <div data-hf-id="hf-spd22" class="kpi-glow" id="glow-leads" data-layout-allow-overflow="true"></div>
            <div data-hf-id="hf-spd23" class="kpi-icon" id="icon-leads">
              <svg data-hf-id="hf-spd24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect data-hf-id="hf-spd25" x="4.5" y="3" width="15" height="18" rx="2" stroke="#F4D998" stroke-width="1.6"></rect>
                <path data-hf-id="hf-spd26" d="M8.5 3v-.2c0-1 .8-1.8 1.8-1.8h3.4c1 0 1.8.8 1.8 1.8V3" stroke="#F4D998" stroke-width="1.6" stroke-linecap="round"></path>
                <path data-hf-id="hf-spd27" d="M7.8 12.4l2.4 2.4 5-5.4" stroke="#F4D998" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                <path data-hf-id="hf-spd28" d="M7.6 17.2h8.2" stroke="#F4D998" stroke-width="1.5" stroke-linecap="round"></path>
              </svg>
            </div>
            <div data-hf-id="hf-spd29" class="kpi-numeral-row">
              <div data-hf-id="hf-spd30" class="kpi-numeral" id="val-leads">0</div>
              <div data-hf-id="hf-spd31" class="kpi-suffix" id="suffix-leads">-30</div>
            </div>
            <div data-hf-id="hf-spd32" class="kpi-track"><div data-hf-id="hf-spd33" class="kpi-track-fill" id="fill-leads"></div></div>
            <div data-hf-id="hf-spd34" class="kpi-label" id="label-leads">ORGANIC WEBSITE LEADS / MONTH</div>
          </div>

        </div>

        <!-- closing caption (fades in ~8.0s, then freeze-hold to 11.5s) -->
        <div data-hf-id="hf-spd35" class="dashboard-caption" id="dashboard-caption">JUST FROM <span data-hf-id="hf-spd36" class="em" id="caption-em">SEO MOMENTUM.</span></div>

      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });

        /* ================= header (0.1 - 1.05s) ================= */
        tl.fromTo("#bg-fill", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.1);

        tl.fromTo(
          "#eyebrow",
          { opacity: 0, y: -16 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.2,
        );
        tl.fromTo(
          "#eyebrow-underline",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.3, ease: "power2.out" },
          0.55,
        );
        tl.fromTo(
          "#sub-label",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          0.7,
        );

        /* ================= tile 1 · calls (enters 1.5s, holds) ================= */
        tl.fromTo(
          "#kpi-calls",
          { y: 70, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" },
          1.5,
        );
        tl.fromTo("#glow-calls", { opacity: 0 }, { opacity: 0.3, duration: 0.6, ease: "power2.out" }, 1.5);
        tl.fromTo(
          "#icon-calls",
          { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.4)" },
          1.7,
        );

        tl.fromTo(
          "#val-calls",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)" },
          1.9,
        );
        var stCalls = { v: 0 };
        tl.fromTo(
          stCalls,
          { v: 0 },
          {
            v: 40,
            duration: 0.9,
            ease: "power2.out",
            immediateRender: false,
            onUpdate: function () {
              document.getElementById("val-calls").textContent = String(Math.round(stCalls.v));
            },
          },
          1.9,
        );
        tl.fromTo(
          "#fill-calls",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.9, ease: "power2.out" },
          1.9,
        );
        tl.fromTo(
          "#suffix-calls",
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
          2.8,
        );
        tl.fromTo(
          "#label-calls",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          3.05,
        );

        /* ================= tile 2 · organic leads (enters 3.5s, holds) ================= */
        tl.fromTo(
          "#kpi-leads",
          { y: 70, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" },
          3.5,
        );
        tl.fromTo("#glow-leads", { opacity: 0 }, { opacity: 0.3, duration: 0.6, ease: "power2.out" }, 3.5);
        tl.fromTo(
          "#icon-leads",
          { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.4)" },
          3.7,
        );

        tl.fromTo(
          "#val-leads",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)" },
          3.9,
        );
        var stLeads = { v: 0 };
        tl.fromTo(
          stLeads,
          { v: 0 },
          {
            v: 28,
            duration: 0.9,
            ease: "power2.out",
            immediateRender: false,
            onUpdate: function () {
              document.getElementById("val-leads").textContent = String(Math.round(stLeads.v));
            },
          },
          3.9,
        );
        tl.fromTo(
          "#fill-leads",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.9, ease: "power2.out" },
          3.9,
        );
        tl.fromTo(
          "#suffix-leads",
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
          4.8,
        );
        tl.fromTo(
          "#label-leads",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          5.05,
        );

        /* ================= closing caption (8.0s) — freeze-hold to 11.5s ================= */
        tl.fromTo(
          "#dashboard-caption",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          8.0,
        );

        // no further tweens scheduled after 8.5s — the last state simply
        // persists (freeze-hold) through 11.5s for a clean cut back to host
        // footage, matching the sibling pieces' closing pattern.

        window.__timelines["seo-payoff-dashboard"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
