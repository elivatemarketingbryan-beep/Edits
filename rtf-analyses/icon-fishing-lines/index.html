<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Icon Fishing Lines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d0817;
        --bg2: #1b1130;
        --accent: #9b5cff;
        --accent-bright: #c9a8ff;
        --text: #f3effa;
        --muted: #9088a8;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", ui-sans-serif, sans-serif;
      }

      /* full-bleed background fill: transparent until the hook lands, then
         opaque near-black for the rest of the piece (alpha-overlay export);
         fades in once and never fades out, so the frame is never blank */
      #bg-fill {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(120% 120% at 50% 42%, var(--bg2) 0%, var(--bg) 62%);
        opacity: 0;
      }

      /* single continuous full-duration scene: everything accumulates,
         nothing exits, so there is never a blank frame between beats */
      .scene {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
      }

      /* ---------------- icon: rod + cast lines + water + catches ---------------- */
      #fishing-svg {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        z-index: 1;
        pointer-events: none;
      }

      #rod-group {
        opacity: 0;
      }
      #rod-shaft {
        fill: none;
        stroke: var(--accent-bright);
        stroke-width: 8;
        stroke-linecap: round;
      }
      #reel {
        fill: var(--bg2);
        stroke: var(--accent-bright);
        stroke-width: 5;
      }

      #water-line {
        fill: none;
        stroke: var(--muted);
        stroke-width: 4;
        stroke-linecap: round;
        opacity: 0.7;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }

      .cast-line {
        fill: none;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      #line-0 {
        stroke: var(--muted);
        opacity: 0.85;
      }
      #line-1,
      #line-2,
      #line-3 {
        stroke: var(--accent-bright);
        opacity: 0.95;
      }

      .ripple {
        fill: none;
        stroke: var(--accent-bright);
        stroke-width: 4;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }

      .catch {
        opacity: 0;
        filter: drop-shadow(0 0 22px rgba(155, 92, 255, 0.55));
        transform-box: fill-box;
        transform-origin: center;
      }
      .catch-body {
        fill: var(--accent);
      }
      .catch-eye {
        fill: var(--bg);
      }

      /* ---------------- label ---------------- */
      .label-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 872px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 160px;
      }
      .label-text {
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-size: 96px;
        line-height: 1;
        color: var(--text);
        text-align: center;
        white-space: nowrap;
        opacity: 0;
      }
      .label-text .em {
        color: var(--accent-bright);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="icon-fishing-lines"
      data-start="0"
      data-duration="6"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg-fill"></div>

      <!-- ============ single continuous scene (0 - 6.0s) ============ -->
      <div id="scene-main" class="clip scene" data-start="0" data-duration="6" data-track-index="0">
        <svg id="fishing-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <!-- hand-drawn wavy water-line divider -->
          <path
            id="water-line"
            pathLength="1"
            d="M440,560 Q520,538 600,560 T760,560 T920,560 T1080,560 T1240,560 T1400,560 T1480,560"
          />

          <!-- rod + reel, abstract line-art -->
          <g id="rod-group">
            <line id="rod-shaft" x1="860" y1="110" x2="1060" y2="160" />
            <circle id="reel" cx="900" cy="122" r="14" />
          </g>

          <!-- beat 1 · single muted line, no catch (reads sparse/limited) -->
          <path id="line-0" class="cast-line" pathLength="1" d="M1060,160 L960,560 L960,660" />

          <!-- beat 2 · three bright lines fan out, each lands a catch -->
          <path id="line-1" class="cast-line" pathLength="1" d="M1060,160 L800,560 L770,690" />
          <path id="line-2" class="cast-line" pathLength="1" d="M1060,160 L1160,560 L1190,700" />
          <path id="line-3" class="cast-line" pathLength="1" d="M1060,160 L650,560 L610,720" />

          <!-- ripples at each water-crossing point (grow past their own resting
               bbox by design, so overflow is intentional — see data-layout-allow-overflow) -->
          <circle id="ripple-1" class="ripple" cx="800" cy="560" r="10" data-layout-allow-overflow="true" />
          <circle id="ripple-2" class="ripple" cx="1160" cy="560" r="10" data-layout-allow-overflow="true" />
          <circle id="ripple-3" class="ripple" cx="650" cy="560" r="10" data-layout-allow-overflow="true" />

          <!-- catch glyphs: simple abstract fish silhouette -->
          <g id="catch-1" class="catch" transform="translate(770,690)">
            <path
              class="catch-body"
              d="M -30,0 C -18,-15 17,-15 28,0 C 17,15 -18,15 -30,0 Z M 28,0 L 47,-12 L 47,12 Z"
            />
            <circle class="catch-eye" cx="-16" cy="-3" r="3" />
          </g>
          <g id="catch-2" class="catch" transform="translate(1190,700)">
            <path
              class="catch-body"
              d="M -30,0 C -18,-15 17,-15 28,0 C 17,15 -18,15 -30,0 Z M 28,0 L 47,-12 L 47,12 Z"
            />
            <circle class="catch-eye" cx="-16" cy="-3" r="3" />
          </g>
          <g id="catch-3" class="catch" transform="translate(610,720)">
            <path
              class="catch-body"
              d="M -30,0 C -18,-15 17,-15 28,0 C 17,15 -18,15 -30,0 Z M 28,0 L 47,-12 L 47,12 Z"
            />
            <circle class="catch-eye" cx="-16" cy="-3" r="3" />
          </g>
        </svg>

        <div class="label-wrap" id="label-wrap">
          <div class="label-text" id="label-text">
            MORE <span class="em">LINES</span>, MORE <span class="em">CATCHES</span>.
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });

        /* ================= bg + rod (0.0 - 0.4s) ================= */
        tl.fromTo("#bg-fill", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);

        tl.fromTo(
          "#rod-group",
          { opacity: 0, y: -16 },
          { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2.0)" },
          0.15,
        );

        /* ================= water-line draws on (0.4 - 0.9s) ================= */
        tl.fromTo(
          "#water-line",
          { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" },
          0.4,
        );

        /* ================= beat 1 · single muted line (0.55 - 1.5s) =================
           reads as sparse / limited: one line, no catch, held on screen */
        tl.fromTo(
          "#line-0",
          { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
          0.55,
        );

        /* ================= beat 2 · fan out + catches (1.5 - 3.0s) =================
           three more lines land staggered, each bright, each catching a fish glyph */
        var casts = [
          { line: "#line-1", ripple: "#ripple-1", catch: "#catch-1", start: 1.5 },
          { line: "#line-2", ripple: "#ripple-2", catch: "#catch-2", start: 2.0 },
          { line: "#line-3", ripple: "#ripple-3", catch: "#catch-3", start: 2.5 },
        ];

        casts.forEach(function (cast) {
          // a single continuous stroke-draw carries the whole reveal — no
          // separate opacity flash competing with it, so the cast reads as
          // one smooth whip-and-settle motion instead of a snap-then-draw
          tl.fromTo(
            cast.line,
            { strokeDashoffset: 1 },
            { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
            cast.start,
          );
          // ripple at the water-crossing point, timed to when the line reaches it
          tl.fromTo(
            cast.ripple,
            { opacity: 0.8, scale: 0.3 },
            { opacity: 0, scale: 2.2, duration: 0.5, ease: "power2.out" },
            cast.start + 0.3,
          );
          // catch settles in gently rather than snapping
          tl.fromTo(
            cast.catch,
            { opacity: 0, scale: 0.5 },
            { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" },
            cast.start + 0.5,
          );
        });

        /* ================= beat 3 · label (4.0 - 4.5s) ================= */
        tl.fromTo(
          "#label-text",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          4.0,
        );

        // freeze-hold from ~4.5s to the end (6.0s) for a clean cut — no further
        // tweens scheduled; the last state persists.

        window.__timelines["icon-fishing-lines"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
