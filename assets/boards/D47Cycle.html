<style>
body{margin:0;background:#170A32}
a{color:#C4B5FD}a:hover{color:#2A37A8}
/* =====================================================================
   EXPLAINER BOARD SYSTEM · brand.css  ("Clean minimal" starter theme)
   One board = 1920×1080 px. Everything is absolutely placed inside a
   root with class "ebs". All values are in board pixels.
   Fonts (Google Fonts):
     Inter 700  · JetBrains Mono 500 · Instrument Serif 600
   ===================================================================== */
.ebs{
  /* ink + paper */
  --ink:#1F2937; --paper:#FFFFFF; --dot:#E5E7EB; --chrome:#1F2937;
  --g1:#374151; --g2:#6B7280; --g3:#9CA3AF; --line:#E5E7EB; --line2:#F3F4F6; --chip:#D1D5DB; --wash:#F6F7F9; --pending:#F6F7F9;
  /* highlighter + accents */
  --hi:#DBEAFE;          /* title marker, focus ring, emphasis glow */
  --sticker:#BFDBFE;     /* yellow sticker fill */
  --indigo:#2563EB; --indigo-l:#EFF6FF;
  --mint:#059669;   --mint-l:#D1FAE5;
  --violet:#7C3AED; --violet-l:#EDE9FE;
  --coral:#E11D48;  --coral-l:#FFE4E6;
  --yellow-l:#DBEAFE;
  --teal:#0891B2; --red:#EF4444; --amber:#D97706; --lime:#ECFDF5; --code:#D1FAE5; --green-l:#A7F3D0;
  /* prompt syntax */
  --p-head:#DBEAFE; --p-asset:#93C5FD; --p-dialogue:#D1FAE5; --p-sound:#FECDD3; --p-text:#F3F4F6;
  /* type */
  --space:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace; --hand:'Playfair Display',serif;font-style:italic;
  /* shadows */
  --sh-soft:0 10px 30px rgba(17,24,39,.10);              /* plain cards */
  --sh-film:0 12px 20px -12px #1F293788;      /* footage tiles */
  --sh-hard:0 10px 30px rgba(17,24,39,.10);                /* "substantial" cards, panels */
  --sh-hard-l:0 10px 30px rgba(17,24,39,.10);            /* pop-up panels, comment, inserts */
  --sh-prompt:0 10px 30px rgba(17,24,39,.10);            /* prompt + code panels */
  --sh-sticker:0 0 0 5px #fff,0 8px 14px rgba(30,32,34,.22),0 2px 3px rgba(30,32,34,.18);
  --ring-hi:0 0 0 8px #DBEAFE,0 24px 44px -14px rgba(0,0,0,.45);
  position:relative;width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;
  background:#170A32 radial-gradient(rgba(196,181,253,.2) 1.5px,transparent 1.5px);background-size:40px 40px;
  color:#FFFFFF;font-family:var(--space);font-weight:700;
}
.ebs *{box-sizing:border-box}
.ebs .n{position:absolute}                     /* every placed element */

/* ---------- TITLE: 76px, marker swept under the words ---------- */
.ebs .title{position:absolute;font:700 76px/1.08 var(--space);letter-spacing:-.035em;display:flex;align-items:center;white-space:nowrap}
.ebs .title span{background:linear-gradient(178deg,transparent 0 50%,#3B1A75 50% 93%,transparent 93%) no-repeat 0 0/100% 100%;padding:0 8px}
.ebs .eyebrow{font:500 24px/1.2 var(--mono);color:var(--g2);text-transform:uppercase;letter-spacing:.07em}

/* ---------- CARDS ---------- */
.ebs .card{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;
  font:700 48px/1.08 var(--space);padding:18px 22px;border:1.5px solid rgba(196,181,253,.2);border-radius:3px;background:#170A32;box-shadow:var(--sh-soft)}
.ebs .card.blue{background:var(--indigo-l);border-color:var(--indigo)}
.ebs .card.mint{background:var(--mint-l)}
.ebs .card.violet{background:var(--violet-l)}
.ebs .card.coral{background:var(--coral-l);border-color:var(--coral)}
.ebs .card.yellow{background:var(--yellow-l)}
.ebs .card.solid{border-radius:22px;box-shadow:var(--sh-hard);border-color:rgba(196,181,253,.45)}      /* "substantial" card */
.ebs .card.ink{background:var(--indigo);color:#FFFFFF}                                       /* the answer / the engine */
.ebs .card.code{background:#0E0720;color:var(--code);border-color:rgba(196,181,253,.45);box-shadow:var(--sh-prompt);font-family:var(--mono);font-weight:500;text-align:left;justify-content:flex-start;padding:36px}
.ebs .card.cap{border:0;background:transparent;box-shadow:none;font-size:28px;padding:0}    /* quiet caption over footage */
.ebs .pending{position:absolute;display:flex;align-items:center;justify-content:center;border:3px dashed #777;background:var(--pending);color:rgba(255,255,255,.62);font:500 38px var(--mono)}

/* ---------- HANDWRITTEN NOTE ---------- */
.ebs .note{position:absolute;font:600 58px/1.12 var(--hand);color:rgba(255,255,255,.82);display:flex;align-items:center;white-space:nowrap}

/* ---------- FOOTAGE TILE ---------- */
.ebs .film{position:absolute;border:1.5px solid rgba(196,181,253,.2);border-radius:8px;overflow:hidden;background:#0E0720;box-shadow:var(--sh-film);isolation:isolate}
.ebs .film video,.ebs .film img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.ebs .film .tag{position:absolute;top:14px;left:14px;max-width:calc(100% - 28px);background:#170A32;color:#FFFFFF;font:500 36px/1.08 var(--mono);padding:8px 14px;z-index:3;border-radius:3px}
.ebs .film.caps .tag{text-transform:uppercase;letter-spacing:.06em;font-size:28px;border:2px solid rgba(196,181,253,.45)}
.ebs .film.token{border-radius:8px}
.ebs .film.token .tag{font-size:17px;padding:3px 7px;top:6px;left:6px;text-transform:uppercase;letter-spacing:.05em}
.ebs .film.burnfull{border:0;border-radius:0;box-shadow:none;background:#0E0720}
.ebs .film.burntile{border-radius:14px;box-shadow:var(--sh-hard-l)}
.ebs .film.burntile .tag{font-size:34px}
.ebs .label{position:absolute;display:flex;align-items:center;justify-content:center;font:700 28px/1 var(--space);white-space:nowrap}   /* caption above a tile */
.ebs .label.box{background:#170A32;border:1.5px solid rgba(196,181,253,.2);height:38px}                                                          /* boxed caption (mask, draft) */
.ebs .image{position:absolute;border:1.5px solid rgba(196,181,253,.2);overflow:hidden;background:#170A32}
.ebs .image img{width:100%;height:100%;object-fit:contain;display:block}

/* ---------- STICKER / PILL ---------- */
.ebs .sticker{display:flex;align-items:center;justify-content:center;border-radius:20px;font:700 54px/1 var(--space);letter-spacing:-.02em;white-space:nowrap;box-shadow:var(--sh-sticker);padding:0 26px;height:100%}
/* ---------- STAMP ---------- */
.ebs .stamp{display:flex;align-items:center;justify-content:center;border:5px solid;border-radius:8px;font:500 40px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.92);white-space:nowrap;height:100%;padding:0 22px}

/* ---------- LINES / ARROWS ---------- */
.ebs .line{font:700 34px/1.2 var(--space);display:flex;align-items:center;white-space:nowrap}
.ebs svg.arrow{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}

/* ---------- DATA ---------- */
.ebs .meter{display:flex;flex-direction:column;justify-content:center;gap:10px;font:700 34px var(--space)}
.ebs .meter .bar{height:40px;border:1.5px solid rgba(196,181,253,.2);border-radius:12px;overflow:hidden;background:#170A32}
.ebs .meter .bar i{display:block;height:100%}
.ebs .layers{display:flex;flex-direction:column;gap:18px}
.ebs .layers .chip{display:flex;align-items:center;gap:12px;height:84px;padding:0 18px;border:3px solid var(--chip);border-radius:14px;background:#170A32;font:700 28px var(--space);opacity:.32}
.ebs .layers .chip i{font:500 20px var(--mono);font-style:normal;opacity:.7}
.ebs .layers .chip.on{opacity:1;border-color:var(--indigo);background:var(--indigo-l)}
.ebs .sheet{background:#170A32;border:1.5px solid rgba(196,181,253,.2);border-radius:18px;overflow:hidden;font:500 28px/1.2 var(--mono);white-space:nowrap;box-shadow:var(--sh-hard)}
.ebs .sheet .r{display:grid;grid-template-columns:180px repeat(4,minmax(0,1fr));border-bottom:2px solid var(--line)}
.ebs .sheet .r:last-child{border-bottom:none}
.ebs .sheet .r>div{padding:14px;border-left:2px solid var(--line2)}
.ebs .sheet .r>div:first-child{border-left:none;color:var(--g2);text-transform:uppercase;letter-spacing:.06em;font-size:24px;display:flex;align-items:center}
.ebs .sheet .hd>div{background:var(--wash);color:var(--g2)}
.ebs .matters{background:#170A32;border:1.5px solid rgba(196,181,253,.2);border-radius:22px;box-shadow:var(--sh-hard);padding:28px 36px;font:500 42px/1.5 var(--mono)}
.ebs .matters small{display:block;font:500 24px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--g2);margin-bottom:6px}
.ebs .matters .st{position:relative;display:inline-block;color:rgba(255,255,255,.45)}
.ebs .matters .st b{position:absolute;left:-4px;right:-4px;top:52%;height:4px;background:rgba(196,181,253,.32);transform-origin:0 50%}
.ebs .qcard{display:flex;align-items:center;background:#170A32;border:1.5px solid rgba(196,181,253,.2);border-radius:22px;box-shadow:var(--sh-hard);padding:0 32px;font:700 46px/1.1 var(--space);height:100%}
.ebs .limits{background:#170A32;border:1.5px solid rgba(196,181,253,.2);border-radius:22px;box-shadow:var(--sh-hard);overflow:hidden}
.ebs .limits .row{display:flex;align-items:center;justify-content:space-between;gap:24px;height:118px;padding:0 32px;border-bottom:2px solid var(--line);font:700 40px/1.15 var(--space)}
.ebs .limits .row:last-child{border-bottom:none}
.ebs .limits .row b{font:500 38px var(--mono);white-space:nowrap}

/* ---------- PANELS / OVERLAYS ---------- */
.ebs .veil{position:absolute;inset:0;background:rgba(255,255,255,.9)}
.ebs .wpanel{position:absolute;background:#170A32;border:1.5px solid rgba(196,181,253,.2);border-radius:22px;box-shadow:var(--sh-hard)}
.ebs .prompt{background:#0E0720;color:var(--p-text);border:1.5px solid rgba(196,181,253,.2);border-radius:22px;box-shadow:var(--sh-prompt);padding:26px 34px;font:500 21px/1.38 var(--mono);overflow:hidden;height:100%}
.ebs .prompt .ptop{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 14px;padding-bottom:12px;border-bottom:2px solid rgba(196,181,253,.45)}
.ebs .prompt .ptop b{font:700 30px var(--space);color:#FFFFFF}
.ebs .prompt .ptop i{font:500 18px var(--mono);font-style:normal;color:#9A9A94;text-transform:uppercase;letter-spacing:.08em}
.ebs .prompt .ph{color:var(--p-head)}.ebs .prompt .pa{color:var(--p-asset)}.ebs .prompt .pd{color:var(--p-dialogue)}.ebs .prompt .ps{color:var(--p-sound)}
.ebs .cmt{display:flex;gap:28px;background:#170A32;border:1.5px solid rgba(196,181,253,.2);border-radius:26px;box-shadow:var(--sh-hard-l);padding:40px 44px;font:700 36px/1.38 var(--space);color:#FFFFFF;height:100%}
.ebs .cav{flex:0 0 96px;height:96px;border-radius:50%;background:var(--indigo);color:#FFFFFF;font:700 38px/96px var(--space);text-align:center}
.ebs .cbody{flex:1;min-width:0}.ebs .chead{margin-bottom:12px}.ebs .chead b{font-size:40px}.ebs .chead span{color:var(--g3);font-size:28px;margin-left:10px}
.ebs .cmt p{margin:0 0 18px}.ebs .cmt em{font-style:normal;color:var(--indigo)}.ebs .cnote{padding:4px 10px;margin-left:-10px!important;border-radius:6px;background:rgba(255,225,77,.55)}
.ebs .cfoot{color:var(--g3);font-size:28px}
.ebs .feedtag{display:inline-block;background:var(--indigo);color:#FFFFFF;font:700 30px var(--space);padding:8px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(17,24,39,.10)}
.ebs .feedview{position:absolute;overflow:hidden;border-radius:22px;-webkit-mask-image:linear-gradient(#111827 88%,transparent);mask-image:linear-gradient(#111827 88%,transparent)}
.ebs .feed{display:flex;flex-direction:column;gap:22px;padding:4px 40px 40px 4px}
.ebs .feed img{display:block;width:100%;border-radius:22px;box-shadow:var(--sh-hard)}
.ebs .burnblack{position:absolute;inset:0;background:#0E0720}
.ebs .burnlab{position:absolute;top:40px;left:40px;background:#170A32;color:#FFFFFF;font:500 32px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:8px 16px;border-radius:4px;z-index:5}
.ebs .i3why{display:inline-block;background:var(--hi);color:#FFFFFF;font:700 34px var(--space);padding:12px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(17,24,39,.10);white-space:nowrap}
.ebs .i3why i{font-style:normal;color:var(--indigo);margin:0 6px}

/* ---------- SWIPE HANDLE, SCAN BAR, PEEL ---------- */
.ebs .handle{position:absolute;width:6px;background:var(--lime);box-shadow:0 0 0 1px rgba(0,0,0,.5);z-index:5}
.ebs .handle i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:var(--lime);border:2px solid rgba(196,181,253,.45);font:700 22px/40px var(--space);font-style:normal;text-align:center}
.ebs .dtag{position:absolute;white-space:nowrap;background:#170A32;color:#FFFFFF;font:500 28px/46px var(--mono);text-transform:uppercase;letter-spacing:.06em;text-align:center;border:2px solid rgba(196,181,253,.45);border-radius:3px;padding:0 14px;z-index:6}
.ebs .scanbar{position:absolute;height:12px;background:linear-gradient(90deg,transparent,rgba(34,160,107,.24) 12%,#170A32 50%,rgba(34,160,107,.24) 88%,transparent);box-shadow:0 0 18px 6px rgba(200,240,120,.75),0 0 46px 14px rgba(200,240,120,.35);border-radius:6px;z-index:6}
.ebs .peel{position:absolute;border:4px solid;border-radius:8px}
.ebs .peel b{position:absolute;right:10px;bottom:10px;font:500 22px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:3px}

/* ---------- CAMERA BOX + CREDIT ---------- */
.ebs .camera{position:absolute;left:1400px;top:704px;width:480px;height:336px;border:1.5px solid rgba(196,181,253,.2);background:#151515;overflow:hidden;border-radius:7px;box-shadow:var(--sh-film);z-index:30}
.ebs .camera video{width:100%;height:100%;object-fit:cover;display:block}
.ebs .credit{position:absolute;left:60px;top:1040px;width:1320px;height:30px;font:700 18px/30px var(--space);color:var(--g3);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebs .logo{height:1.05em;width:auto;margin-right:.38em;vertical-align:-.16em;border-radius:.18em}


.ebs .spec{position:absolute;font:500 20px/1.45 var(--mono);color:rgba(255,255,255,.82)}
.ebs .spec h4{margin:0 0 8px;font:700 30px/1.15 var(--space);color:#FFFFFF;letter-spacing:-.01em}
.ebs .spec p{margin:0 0 14px}
.ebs .spec b{font-weight:500;color:#FFFFFF;background:rgba(59,26,117,.32);padding:1px 6px;border-radius:4px}
.ebs .spec ol{margin:0;padding:0;list-style:none;counter-reset:s}
.ebs .spec ol li{position:relative;padding-left:52px;margin:0 0 16px;counter-increment:s}
.ebs .spec ol li:before{content:counter(s);position:absolute;left:0;top:-2px;width:36px;height:36px;border-radius:50%;background:#0E0720;color:#FFFFFF;font:500 20px/36px var(--mono);text-align:center}
.ebs .pin{position:absolute;width:40px;height:40px;border-radius:50%;background:#0E0720;color:#FFFFFF;font:500 22px/40px var(--mono);text-align:center;z-index:40;box-shadow:0 0 0 4px rgba(196,181,253,.25)}
.ebs .kicker{position:absolute;left:60px;top:22px;font:500 22px/1 var(--mono);color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:.08em}
.ebs .kicker em{font-style:normal;color:#FFFFFF}
.ebs .rule{position:absolute;border-top:2px dashed rgba(196,181,253,.2)}
.ebs .do,.ebs .dont{position:absolute;font:500 22px/1.4 var(--mono);padding:14px 18px;border-radius:12px;border:3px solid}
.ebs .do{border-color:#22A06B;background:#F2FAF7}.ebs .dont{border-color:#E5484D;background:rgba(229,72,77,.22)}
.ebs .do b,.ebs .dont b{display:block;font:700 26px var(--space);margin-bottom:4px}
.ebs .do b{color:#4CC38A}.ebs .dont b{color:#FF8A8E}
.ebs .swatch{position:absolute;border:1.5px solid rgba(196,181,253,.2);border-radius:14px;overflow:hidden;background:#170A32}
.ebs .swatch .c{height:48%}.ebs .swatch .t{padding:8px 12px;font:500 16px/1.3 var(--mono);color:rgba(255,255,255,.82)}.ebs .swatch .t b{display:block;font:700 24px var(--space);color:#FFFFFF}
.ebs .tick{position:absolute;font:500 18px var(--mono);color:rgba(255,255,255,.45)}
.ebs .zone{position:absolute;border:3px dashed;border-radius:6px;display:flex;align-items:flex-start;justify-content:flex-start;padding:10px 14px;font:500 20px/1.3 var(--mono)}
.ebs .tbl{position:absolute;border:1.5px solid rgba(196,181,253,.2);border-radius:18px;overflow:hidden;background:#170A32;box-shadow:0 10px 30px rgba(17,24,39,.10);font:500 21px/1.3 var(--mono)}
.ebs .tbl .r{display:grid;border-bottom:2px solid rgba(196,181,253,.2)}.ebs .tbl .r:last-child{border-bottom:0}
.ebs .tbl.sm{font-size:17px}.ebs .tbl.sm .r>div{padding:7px 12px}.ebs .tbl.sm .r>div.sp{font-size:20px}
.ebs .tbl .r>div{padding:11px 14px;border-left:2px solid rgba(196,181,253,.2);min-width:0}.ebs .tbl .r>div:first-child{border-left:0}
.ebs .tbl .hd{background:rgba(59,26,117,.32);color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:.06em;font-size:18px}
.ebs .tbl .r>div.sp{font:700 24px var(--space);color:#FFFFFF}


@property --num{syntax:'<integer>';initial-value:0;inherits:false}
.ebs .cnt{counter-reset:n var(--num)}.ebs .cnt::after{content:var(--pre,'') counter(n) var(--suf,'')}
@keyframes popIn{0%,6%{opacity:0;transform:translateY(14px) scale(.985)}12%,100%{opacity:1;transform:none}}
@keyframes slam{0%,8%{opacity:0;transform:scale(1.6) rotate(-6deg)}14%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:1;transform:scale(1)}}
.ebs .lbl{position:absolute;font:500 22px/1.2 var(--mono);color:rgba(255,255,255,.62);text-transform:uppercase;letter-spacing:.06em}
.ebs .val{position:absolute;font:700 34px/1 var(--space);color:#FFFFFF}

@keyframes orbit{0%{offset-distance:0%}100%{offset-distance:100%}}
.ebs .tok{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:#3B1A75;border:1.5px solid rgba(196,181,253,.2);offset-path:path('M 610 310 A 300 300 0 1 1 609.99 310 Z');offset-anchor:50% 50%;offset-rotate:0deg;animation:orbit 10s linear infinite;z-index:8}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.ebs .trk{transform-origin:610px 610px;animation:spin 40s linear infinite}
@keyframes nd0{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}0.0%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}2.0%,14.0%{transform:scale(1.08);box-shadow:0 10px 30px rgba(17,24,39,.10),0 0 0 8px rgba(139,92,246,.4)}18.0%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}}
.ebs .nd0{animation:nd0 10s infinite}
@keyframes nd1{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}19.9%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}22.0%,34.0%{transform:scale(1.08);box-shadow:0 10px 30px rgba(17,24,39,.10),0 0 0 8px rgba(139,92,246,.4)}38.0%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}}
.ebs .nd1{animation:nd1 10s infinite}
@keyframes nd2{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}39.9%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}42.0%,54.0%{transform:scale(1.08);box-shadow:0 10px 30px rgba(17,24,39,.10),0 0 0 8px rgba(139,92,246,.4)}58.0%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}}
.ebs .nd2{animation:nd2 10s infinite}
@keyframes nd3{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}59.9%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}62.0%,74.0%{transform:scale(1.08);box-shadow:0 10px 30px rgba(17,24,39,.10),0 0 0 8px rgba(139,92,246,.4)}78.0%{transform:scale(1);box-shadow:0 10px 30px rgba(17,24,39,.10)}}
