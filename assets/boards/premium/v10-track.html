<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@1,600;1,700;1,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vsl.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="gfx.js"></script>
<style>
  /* 1:39-1:46 portrait: step 4, a parcel-style tracker shows which stage every customer is in */

  .w { position: absolute; left: 90px; top: 0; width: 1040px; height: 1080px; }
  .kk { position: absolute; left: 0; top: 150px; }
  .st { position: absolute; left: 0; top: 186px; font-size: 104px; font-weight: 900; letter-spacing: -0.04em; white-space: nowrap; }
  .tl { position: absolute; left: 0; top: 360px; width: 520px; height: 576px; }
  .rail { position: absolute; left: 21px; top: 22px; width: 4px; height: 480px; background: rgba(255,255,255,0.14); }
  .fill { position: absolute; left: 21px; top: 22px; width: 4px; height: 288px; background: var(--gold); transform-origin: 50% 0; box-shadow: 0 0 16px rgba(232,199,122,0.8); }
  .s { position: absolute; left: 0; height: 46px; display: flex; align-items: center; gap: 30px; font-size: 40px; font-weight: 800; white-space: nowrap; color: rgba(255,255,255,0.5); }
  .dt { width: 46px; height: 46px; border-radius: 50%; box-sizing: border-box; background: #1a0b38; border: 3px solid rgba(196,181,253,0.4); flex: none; }
  .here { position: absolute; left: 560px; top: 618px; padding: 22px 30px; border-radius: 18px; background: linear-gradient(160deg, #f3d892, #b8913f); color: #1c1306; font-size: 38px; font-weight: 900; white-space: nowrap; box-shadow: 0 0 60px rgba(232,199,122,0.4); }
  .here small { display: block; font-size: 22px; font-weight: 800; }

</style></head><body>
<div class="root" id="root" data-composition-id="v10-track" data-start="0" data-width="1920" data-height="1080" data-duration="7.0" data-layout="portrait">
>
  <div class="w"><div class="kk kick g">Step 4</div><div class="st">Track it.</div><div class="tl"><div class="rail"></div><div class="fill"></div><div class="s s0" style="top:0px"><span class="dt"></span>New lead</div><div class="s s1" style="top:96px"><span class="dt"></span>Contacted</div><div class="s s2" style="top:192px"><span class="dt"></span>Qualified</div><div class="s s3" style="top:288px"><span class="dt"></span>Quote sent</div><div class="s s4" style="top:384px"><span class="dt"></span>Followed up</div><div class="s s5" style="top:480px"><span class="dt"></span>Won</div></div>
  <div class="here"><small>Maria Lopez</small>You are here</div></div>
<div class="winp"></div>
</div>
<script>document.fonts.ready.then(() => { const T0 = 98.95; const g = gfx("v10-track", T0, 7.0); const tl = g.tl, at = g.at;

g.in(".kk, .st", 99.45, {y: 22});
tl.set(".here", {autoAlpha: 0}, 0);
g.in(".s", 100.8, {y: 16, stagger: 0.06, d: 0.35});
g.in(".rail", 100.8, {y: 0});
tl.fromTo(".fill", {scaleY: 0}, {scaleY: 1, duration: 1.8, ease: "power1.inOut"}, at(101.7));
[0, 1, 2, 3].forEach((i) => { tl.to(`.s${i} .dt`, {backgroundColor: "#e8c77a", borderColor: "#fff3cf", duration: 0.15}, at(101.75 + i * 0.58)); tl.to(`.s${i}`, {color: "#ffffff", duration: 0.15}, at(101.75 + i * 0.58)); });
tl.fromTo(".here", {autoAlpha: 0, x: -24, scale: 0.92}, {autoAlpha: 1, x: 0, scale: 1, duration: 0.35, ease: "back.out(2)"}, at(104.5));
g.out(".w", 105.45);
tl.fromTo(".winp", {autoAlpha: 0}, {autoAlpha: 1, duration: 0.35}, 0.02); tl.to(".winp", {autoAlpha: 0, duration: 0.3}, 7.0 - 0.36);
g.done(); });</script><script>window.__timelines=window.__timelines||{};if(location.search.includes('play')){document.documentElement.style.background='#050308';addEventListener('load',function run(){var t=Object.values(window.__timelines||{})[0];if(!t){setTimeout(run,100);return}t.eventCallback('onComplete',function(){setTimeout(function(){t.restart()},900)});t.play()})}</script></body></html>
