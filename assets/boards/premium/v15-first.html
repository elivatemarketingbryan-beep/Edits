<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@1,600;1,700;1,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* 2:24-2:33 focus: a race to the customer, first response wins; then the catch: fast to the wrong person is a waste */

  .A, .B { position: absolute; inset: 0; }
  .tt { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-size: 104px; font-weight: 900; letter-spacing: -0.04em; }
  .lane { position: absolute; left: 270px; width: 1380px; height: 96px; border-radius: 48px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 48px; transform-origin: 0 50%; display: flex; align-items: center; justify-content: flex-end; }
  .lb { position: absolute; left: 34px; top: 26px; font-size: 38px; font-weight: 900; white-space: nowrap; z-index: 2; }
  .wn { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 104px; padding-bottom: 10px; }
  .B .x { position: absolute; left: 0; right: 0; top: 320px; text-align: center; font-size: 84px; font-weight: 900; letter-spacing: -0.035em; }
  .B .y { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 150px; color: #ff8a8e; }

</style></head><body>
<div class="root" id="root" data-composition-id="v15-first" data-start="0" data-width="1920" data-height="1080" data-duration="9.0" data-layout="focus">
>
  <div class="A"><div class="tt">First to respond.</div>
    <div class="lane" style="top:470px"><div class="bar" id="b1" style="background:linear-gradient(90deg,#b8913f,#f3d892)"></div><div class="lb" style="color:#1c1306">You</div></div>
    <div class="lane" style="top:600px"><div class="bar" id="b2" style="background:linear-gradient(90deg,#3b1a75,#6d28d9)"></div><div class="lb">The other guy</div></div>
    <div class="wn goldt gglow">Usually wins the job.</div></div>
  <div class="B"><div class="x">But fast, to the wrong person?</div><div class="y">Still a waste.</div></div>
</div>
<script>document.fonts.ready.then(() => { const T0 = 143.9; const g = gfx("v15-first", T0, 9.0); const tl = g.tl, at = g.at;

tl.set(".wn, .B .x, .B .y", {autoAlpha: 0}, 0);
g.in(".tt", 144.4, {y: 24}); g.in(".lane", 144.6, {y: 18});
tl.fromTo("#b1", {scaleX: 0}, {scaleX: 1, duration: 1.3, ease: "power2.inOut"}, at(145.1));
tl.fromTo("#b2", {scaleX: 0}, {scaleX: 0.46, duration: 1.3, ease: "power2.inOut"}, at(145.1));
tl.fromTo(".wn", {autoAlpha: 0, y: 24, filter: "blur(10px)"}, {autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out"}, at(146.5));
tl.to(".A", {autoAlpha: 0, y: -26, filter: "blur(10px)", duration: 0.25, ease: "power2.in"}, at(148.75));
g.in(".B .x", 149.2, {y: 24});
tl.fromTo(".B .y", {autoAlpha: 0, scale: 1.2, filter: "blur(12px)"}, {autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out"}, at(151.3));
g.out(".B", 152.45);
g.done(); });</script><script>window.__timelines=window.__timelines||{};if(location.search.includes('play')){document.documentElement.style.background='#050308';addEventListener('load',function run(){var t=Object.values(window.__timelines||{})[0];if(!t){setTimeout(run,100);return}t.eventCallback('onComplete',function(){setTimeout(function(){t.restart()},900)});t.play()})}</script></body></html>
