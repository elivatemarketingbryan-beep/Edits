</div>
<script>document.fonts.ready.then(() => { const T0 = 475.5; const g = gfx("v37-end-card", T0, 10.8); const tl = g.tl, at = g.at;

g.stageIn(475.5);
tl.set(".c", {autoAlpha: 0}, 0);
g.in(".kk, .h", 476.0, {y: 22});
tl.fromTo(".sl", {autoAlpha: 0, scale: 0.94}, {autoAlpha: 1, scale: 1, duration: 0.55, ease: "power3.out"}, at(476.2));
