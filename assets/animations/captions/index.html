<!doctype html>
<!-- Captions: a transparent caption overlay built from word timings, one mode per line:
     build, karaoke, blur, accent, emphasis, statement, strike-swap, scattered, command, slide,
     stack, brush, pointer, power-split, apple, pop-rise, box, tilt (see styles/CAPTIONS.md),
     plus an optional "look" per line: gradient, premium, shine, flicker. --file is a
     captions.json { "lines": [ { "mode", "words": [ { "w", "s", "e" } ], "accent": [...],
     "swap": "...", "power": [...], "box": [...], "look": "..." } ] } with output-timeline
     seconds. Renders to WebM with alpha to sit over the edit. Seek-safe: every change is
     placed on the timeline at its word's time. Premium finish (STYLE-GUIDE.md): tracking is
     tight by default (-0.015em) and every line uses at least two motions. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: transparent; }
      .line { position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; opacity: 0; }
      .w { display: inline-block; white-space: pre; }
      .sans { font-family: "__FONT_SANS__", "Inter", sans-serif; font-weight: 800; color: #fff; text-shadow: 0 3px 14px rgba(0, 0, 0, .75), 0 1px 2px rgba(0, 0, 0, .6); }
      .serif { font-family: "__FONT_SERIF__", Georgia, serif; font-style: italic; font-weight: 400; }
      .grad { background: linear-gradient(180deg, __ACCENT_LIGHT__ 0%, __ACCENT__ 55%, __ACCENT_DEEP__ 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 18px rgba(0, 0, 0, .55)); padding: 0 .08em; }
      .ul { position: absolute; height: .09em; background: __ACCENT__; border-radius: .05em; transform-origin: left center; transform: scaleX(0); }
      .strike { position: absolute; left: 4%; right: 4%; overflow: visible; }
      .command { color: #E5484D; text-transform: uppercase; text-shadow: 0 6px 24px rgba(0, 0, 0, .7); }
      .line { letter-spacing: -0.015em; }
      /* looks */
      .look-gradient .w { background: linear-gradient(180deg, #fff 0%, #fff 52%, __ACCENT_LIGHT__ 52%, __ACCENT_LIGHT__ 100%); -webkit-background-clip: text; background-clip: text;
        color: transparent; text-shadow: none; filter: drop-shadow(0 4px 14px rgba(0, 0, 0, .6)); }
      .look-negative .w { color: #fff; text-shadow: none; filter: none; background: none; }
      .flashbox { position: absolute; inset: -.08em -.06em; background: #fff; pointer-events: none; }
      .look-premium .w { color: __ACCENT__; text-shadow: .045em .045em 0 #fff, 0 0 .06em rgba(0, 0, 0, .85), 0 0 .02em rgba(0, 0, 0, .9), 0 8px 26px rgba(0, 0, 0, .7); }
      .line.shine .w { color: transparent; text-shadow: none; -webkit-background-clip: text; background-clip: text; background-repeat: no-repeat; background-size: 300% 100%;
        background-color: transparent; background-image: linear-gradient(100deg, transparent 0%, transparent 30%, var(--shine, #EDE9FE) 50%, transparent 70%, transparent 100%);
        filter: drop-shadow(0 0 8px var(--shine, #EDE9FE)) drop-shadow(0 0 20px var(--shine, #EDE9FE)); }
      /* power-split: the huge bold italic power word */
      .power { font-family: "__FONT_SANS__", "Inter", sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.03em; color: #fff; text-shadow: 0 6px 26px rgba(0, 0, 0, .6); }
      .apple { font-family: "__FONT_SANS__", "Inter", sans-serif; font-weight: 600; letter-spacing: -0.025em; }
      .apple .w {
        background: linear-gradient(120deg, __ACCENT_LIGHT__ 0%, #fff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 12px rgba(0, 0, 0, .45)); }
      .rise { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 .02em .06em; }
      .rise > span { display: inline-block; }
      .boxmark { position: absolute; border-radius: .12em; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="__W__" data-height="__H__"></div>
    <script>
      const W = __W__, H = __H__, DUR = __DURATION__, DATA = __CAPTIONS__;
      const portrait = H > W, root = document.getElementById('root');
      const u = portrait ? W / 1080 : H / 1080;               // one design unit = 1px at 1080 short side
      const LOUD = new Set(['emphasis', 'statement', 'strike-swap', 'scattered', 'command', 'brush', 'pointer', 'power-split', 'tilt']);
      const lines = DATA.lines.filter((l) => l.words && l.words.length).map((l) => ({ ...l, start: l.words[0].s, last: l.words[l.words.length - 1].e }));
      // A line ends at its hold time or when the next line of the same kind (running vs loud) starts.
      lines.forEach((l, i) => {
        const loud = LOUD.has(l.mode), hold = loud ? 1.3 : 0.6;
        const next = lines.slice(i + 1).find((n) => LOUD.has(n.mode) === loud);
        l.end = Math.min(DUR, l.last + hold, next ? next.start : Infinity);
      });
      let seed = 3; const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const tl = gsap.timeline({ paused: true });
      const sfx = [];
      let curLine = null; const lineEls = new Map();   // line -> its elements (for looks)

      function mk(cls, parent, text) { const e = document.createElement('div'); e.className = cls; if (text != null) e.textContent = text; parent.appendChild(e); return e; }
      function lineBox(top, fontPx, maxW, cls) {
        const el = mk('line ' + cls, root);
        if (curLine) { if (!lineEls.has(curLine)) lineEls.set(curLine, []); lineEls.get(curLine).push(el); }
        Object.assign(el.style, { top: top + 'px', fontSize: fontPx + 'px', padding: `0 ${(W - maxW) / 2}px`, columnGap: fontPx * 0.26 + 'px', rowGap: fontPx * 0.05 + 'px', lineHeight: 1.15 });
        return el;
      }
      function showHide(el, l) {
        tl.set(el, { opacity: 1 }, l.start - 0.001);
        tl.to(el, { opacity: 0, duration: 0.18, ease: 'power1.in' }, l.end - 0.18);
      }
      // Portrait keeps loud captions above the face (top band) and below it (lower band), clear of the safe zones.
      const lowY = portrait ? H * 0.66 : H * 0.8, highY = portrait ? H * 0.115 : H * 0.1;

      for (const l of lines) {
        const words = l.words; curLine = l;
        if (['build', 'karaoke', 'blur', 'accent'].includes(l.mode)) {
          const fs = (l.mode === 'blur' ? 46 : 58) * u * (portrait ? 1.1 : 1);
          const el = lineBox(lowY, fs, W * (portrait ? 0.84 : 0.7), 'sans');
          const spans = words.map((w) => mk('w', el, w.w));
          showHide(el, l);
          spans.forEach((sp, i) => {
            const t = words[i].s;
            if (l.mode === 'build' || l.mode === 'accent') { gsap.set(sp, { opacity: 0, y: fs * 0.32 }); tl.to(sp, { opacity: 1, duration: 0.1, ease: 'power1.out' }, t); tl.to(sp, { y: 0, duration: 0.32, ease: 'back.out(2.4)' }, t); }
            if (l.mode === 'karaoke') { gsap.set(sp, { opacity: 0.38 }); tl.to(sp, { opacity: 1, duration: 0.08 }, t); }
            if (l.mode === 'blur') { gsap.set(sp, { opacity: 0.15, filter: 'blur(14px)' }); tl.to(sp, { opacity: 1, filter: 'blur(0px)', duration: 0.28, ease: 'power2.out' }, t); }
            if (l.mode === 'accent' && (l.accent || []).some((a) => a.toLowerCase() === words[i].w.toLowerCase().replace(/[^\w']/g, ''))) {
              tl.to(sp, { color: '__ACCENT_LIGHT__', duration: 0.1 }, t);
              const ul = mk('ul', el); sp.style.position = 'relative';
              sp.appendChild(ul); Object.assign(ul.style, { left: '0', right: '0', bottom: -fs * 0.08 + 'px' });
              tl.to(ul, { scaleX: 1, duration: 0.35, ease: 'power2.inOut' }, t + 0.05);
              sfx.push({ cue: 'stretch', at: +(t + 0.05).toFixed(2), note: 'accent underline' });
            }
          });
        } else if (l.mode === 'emphasis' || l.mode === 'scattered') {
          const big = l.mode === 'emphasis';
          const fs = (big ? 150 : 84) * u * (portrait ? 0.95 : 1);
          const el = lineBox(big ? highY : (portrait ? H * 0.5 : H * 0.3), fs, W * 0.9, 'serif' + (big ? '' : ' sans'));
          if (!big) { el.style.fontWeight = 400; el.style.fontFamily = '"__FONT_SERIF__", Georgia, serif'; el.style.fontStyle = 'italic'; el.style.rowGap = fs * 0.4 + 'px'; }
          const spans = words.map((w) => mk('w' + (big ? ' grad' : ''), el, w.w));
          showHide(el, l);
          spans.forEach((sp, i) => {
            if (big) { gsap.set(sp, { clipPath: 'inset(0 100% 0 0)' }); tl.to(sp, { clipPath: 'inset(0 0% 0 0)', duration: 0.35, ease: 'power2.out' }, words[i].s); }
            else { // scattered: each word on its own height and size
              gsap.set(sp, { opacity: 0, y: (rand() - 0.5) * fs * 1.6, scale: 0.75 + rand() * 0.55 });
              tl.to(sp, { opacity: 1, duration: 0.4, ease: 'power1.out' }, words[i].s);
            }
          });
          if (big) sfx.push({ cue: 'whoosh-simple', at: +l.start.toFixed(2), note: 'emphasis caption' });
        } else if (l.mode === 'statement' || l.mode === 'strike-swap') {
          const word = words.map((w) => w.w).join(' ').toUpperCase();
          const fs = Math.min(190 * u, (W * 0.86) / (word.length * 0.78));
          const el = lineBox(highY, fs, W * 0.96, 'sans');
          Object.assign(el.style, { letterSpacing: '0.02em', flexWrap: 'nowrap', columnGap: '0px' });
          const letters = [...word].map((c) => mk('w', el, c));
          // A swap holds the struck word on screen until its replacement has landed.
          if (l.mode === 'strike-swap' && l.swap) l.end = Math.max(l.end, Math.min(DUR, l.last + 0.15 + 1.6));
          showHide(el, l);
          const span = Math.max(0.3, l.last - l.start);
          letters.forEach((c, i) => { gsap.set(c, { opacity: 0 }); tl.to(c, { opacity: 1, duration: 0.15 }, l.start + (span * i) / letters.length); });
          sfx.push({ cue: 'hit', at: +l.start.toFixed(2), note: 'statement word' });
          if (l.mode === 'strike-swap') {
            const svgNS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('class', 'strike'); svg.setAttribute('viewBox', '0 0 100 10'); svg.setAttribute('preserveAspectRatio', 'none');
            Object.assign(svg.style, { top: fs * 0.45 + 'px', height: fs * 0.18 + 'px', width: '92%' });
            const p = document.createElementNS(svgNS, 'path');
            p.setAttribute('d', 'M1,6 C20,4.5 35,6.5 50,5 S80,4 99,5.5'); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#E5484D');
            p.setAttribute('stroke-width', '2.4'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('pathLength', '100');
            
            svg.appendChild(p); el.appendChild(svg);
            const strikeAt = l.last + 0.15, len = 100;
            p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
            tl.to(p, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.inOut' }, strikeAt);
            sfx.push({ cue: 'glitch', at: +strikeAt.toFixed(2), note: 'strike-through' });
            if (l.swap) {
              const sw = lineBox(highY + fs * 1.15, fs * 0.95, W * 0.9, 'serif');
              const s = mk('w grad', sw, l.swap);
              tl.set(sw, { opacity: 1 }, strikeAt + 0.35);
              gsap.set(s, { clipPath: 'inset(0 100% 0 0)' });
              tl.to(s, { clipPath: 'inset(0 0% 0 0)', duration: 0.45, ease: 'power2.out' }, strikeAt + 0.35);
              tl.to(sw, { opacity: 0, duration: 0.18 }, l.end - 0.18);
              sfx.push({ cue: 'stretch', at: +(strikeAt + 0.35).toFixed(2), note: 'replacement word' });
            }
          }
        } else if (l.mode === 'command') {
          const word = words.map((w) => w.w).join(' ');
          const fs = Math.min(150 * u, (W * 0.86) / (word.length * 0.6));
          const el = lineBox(lowY - fs * 1.45, fs, W * 0.92, 'serif command');
          const s = mk('w', el, word.toUpperCase());
          showHide(el, l);
          gsap.set(s, { scale: 1.25, opacity: 0 });
          tl.to(s, { scale: 1, opacity: 1, duration: 0.25, ease: 'power3.out' }, l.start);
          sfx.push({ cue: 'hit', at: +l.start.toFixed(2), note: 'command caption' });
        }
      }
      // slide: the whole line arrives at once, each word sliding up (or down, dir:"down")
      // into place 2 frames after the previous one; on exit the words blur out.
      for (const l of lines.filter((x) => x.mode === 'slide')) {
        curLine = l;
        const down = l.dir === 'down', fs = 60 * u * (portrait ? 1.1 : 1);
        const el = lineBox(down ? (portrait ? H * 0.16 : H * 0.12) : lowY, fs, W * (portrait ? 0.84 : 0.72), 'sans');
        el.style.overflow = 'hidden';                        // words rise out of the line's own edge
        el.style.paddingTop = el.style.paddingBottom = fs * 0.15 + 'px';
        const spans = l.words.map((w) => mk('w', el, w.w));
        tl.set(el, { opacity: 1 }, l.start - 0.001);
        spans.forEach((sp, i) => {
          gsap.set(sp, { yPercent: down ? -120 : 120 });
          tl.to(sp, { yPercent: 0, duration: 0.6, ease: 'power3.out' }, l.start + i * 2 / 30);
          tl.to(sp, { filter: 'blur(12px)', opacity: 0, duration: 0.25, ease: 'power1.in' }, l.end - 0.25 + i * 1 / 30 - spans.length / 30);
        });
        tl.set(el, { opacity: 0 }, l.end);
      }

      // stack: one big word with the small words tucked above and below it in a tight block.
      // brush: a huge white word, then a red paint stroke slashes across it.
      // pointer: a small stacked note beside the head with a hand-drawn arrow at the speaker.
      for (const l of lines) {
        const words = l.words;
        const clean = (w) => w.toLowerCase().replace(/[^\w']/g, '');
        if (l.mode === 'stack') {
          const bigIdx = l.big ? words.findIndex((w) => clean(w.w) === clean(l.big)) : words.reduce((b, w, i) => (w.w.length > words[b].w.length ? i : b), 0);
          const small = 46 * u * (portrait ? 1.1 : 1), big = small * 2.6;
          const el = mk('line sans', root);
          Object.assign(el.style, { top: (portrait ? H * 0.6 : H * 0.66) + 'px', flexDirection: 'column', alignItems: 'center', lineHeight: 0.92, letterSpacing: '-0.02em' });
          const before = words.slice(0, bigIdx), after = words.slice(bigIdx + 1);
          const row = (ws, size) => { const r = mk('', el); Object.assign(r.style, { display: 'flex', gap: size * 0.22 + 'px', fontSize: size + 'px' }); return ws.map((w) => mk('w', r, w.w)); };
          const spans = [...row(before, small), ...row([words[bigIdx]], big), ...row(after, small)];
          spans[before.length].style.fontWeight = 900;
          showHide(el, l);
          spans.forEach((sp, i) => {
            const isBig = i === before.length;
            if ((l.accent || []).some((a) => clean(a) === clean(words[i].w))) sp.style.color = '__ACCENT_LIGHT__';
            gsap.set(sp, { opacity: 0, scale: isBig ? 1.35 : 0.6 });
            tl.to(sp, { opacity: 1, scale: 1, duration: isBig ? 0.22 : 0.18, ease: isBig ? 'power3.out' : 'back.out(2.5)' }, words[i].s);
          });
        } else if (l.mode === 'brush') {
          const word = words.map((w) => w.w).join(' ').toUpperCase();
          const fs = Math.min(200 * u, (W * 0.84) / (word.length * 0.74));
          const el = lineBox(portrait ? highY : H * 0.36, fs, W * 0.96, 'sans');
          Object.assign(el.style, { flexWrap: 'nowrap', columnGap: '0px', letterSpacing: '-0.01em' });
          const s = mk('w', el, word);
          s.style.position = 'relative'; s.style.fontWeight = 900;
          showHide(el, l);
          gsap.set(s, { opacity: 0, scale: 1.15 });
          tl.to(s, { opacity: 1, scale: 1, duration: 0.2, ease: 'power3.out' }, l.start);
          // The stroke: a thick rough-edged red swipe drawn bottom-left to top-right across the word.
          const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
          svg.setAttribute('viewBox', '0 0 100 40'); svg.setAttribute('preserveAspectRatio', 'none');
          Object.assign(svg.style, { position: 'absolute', left: '-6%', top: '-10%', width: '112%', height: '120%', overflow: 'visible' });
          svg.innerHTML = `<defs><filter id="rough${Math.round(l.start * 100)}" x="-10%" y="-30%" width="120%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs>`;
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('d', 'M4,34 C25,28 45,20 62,15 S88,8 97,5');
          Object.assign(p.style, { fill: 'none', stroke: '#D7263D', strokeWidth: '9', strokeLinecap: 'round', opacity: 0.92, filter: `url(#rough${Math.round(l.start * 100)})` });
          p.setAttribute('pathLength', '100'); p.style.strokeDasharray = 100; p.style.strokeDashoffset = 100;
          svg.appendChild(p); s.appendChild(svg);
          const at = l.last + 0.05;
          tl.to(p, { strokeDashoffset: 0, duration: 0.22, ease: 'power3.out' }, at);
          sfx.push({ cue: 'hit', at: +l.start.toFixed(2), note: 'brush word' }, { cue: 'whoosh-high', at: +at.toFixed(2), note: 'brush stroke' });
        } else if (l.mode === 'pointer') {
          const side = l.side === 'right' ? 'right' : 'left';
          const fs = 44 * u * (portrait ? 1.05 : 1);
          const el = mk('line sans', root);
          const x = side === 'left' ? W * 0.06 : W * 0.6;
          Object.assign(el.style, { top: (portrait ? H * 0.3 : H * 0.18) + 'px', left: x + 'px', right: 'auto', width: W * 0.34 + 'px',
            flexDirection: 'column', alignItems: side === 'left' ? 'flex-start' : 'flex-end', lineHeight: 0.95, fontSize: fs + 'px' });
          const spans = words.map((w, i) => { const s = mk('w', el, w.w); if (i === words.length - 1) { s.style.fontSize = fs * 1.9 + 'px'; s.style.fontWeight = 900; } return s; });
          showHide(el, l);
          spans.forEach((sp, i) => { gsap.set(sp, { opacity: 0, y: fs * 0.3 }); tl.to(sp, { opacity: 1, y: 0, duration: 0.16, ease: 'back.out(2)' }, words[i].s); });
          // Curved hand-drawn arrow from under the note toward the frame centre (the speaker).
          const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
          const aw = W * 0.16, ah = H * (portrait ? 0.07 : 0.13);
          svg.setAttribute('viewBox', '0 0 100 60');
          Object.assign(svg.style, { position: 'absolute', width: aw + 'px', height: ah + 'px', overflow: 'visible', transform: side === 'left' ? 'none' : 'scaleX(-1)',
            [side === 'left' ? 'left' : 'right']: W * 0.17 + 'px', top: (portrait ? H * 0.3 : H * 0.18) + fs * 3.4 + 'px' });
          svg.innerHTML = `<path d="M6,6 C18,44 52,58 90,40" pathLength="100" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100"/>` +
            `<path d="M76,32 L91,40 L78,52" pathLength="100" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"/>`;
          svg.style.filter = 'drop-shadow(0 2px 6px rgba(0,0,0,.6))';
          root.appendChild(svg);
          const [shaft, head] = svg.querySelectorAll('path');
          gsap.set(svg, { opacity: 0 });
          tl.set(svg, { opacity: 1 }, l.start);
          tl.to(shaft, { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, l.start + 0.1);
          tl.to(head, { strokeDashoffset: 0, duration: 0.15, ease: 'power2.out' }, l.start + 0.42);
          tl.to(svg, { opacity: 0, duration: 0.18 }, l.end - 0.18);
          sfx.push({ cue: 'pop', at: +l.start.toFixed(2), note: 'pointer note' });
        }
      }
      // ---- Patrik Key's caption styles (CAPTIONS.md): power-split, apple, pop-rise, box, tilt ----
      for (const l of lines) {
        const words = l.words; curLine = l;
        const clean = (w) => w.toLowerCase().replace(/[^\w']/g, '');
        const inList = (list, w) => (list || []).some((a) => clean(a) === clean(w));
        if (l.mode === 'power-split') {
          // Small words slide up in the lower band; the power word(s) arrive huge across the head:
          // x slide + blur + scale (three motions). With a matte composited on top, the head covers its middle.
          const powerIdx = words.map((w, i) => (inList(l.power, w.w) ? i : -1)).filter((i) => i >= 0);
          const pw = powerIdx.length ? powerIdx : [words.reduce((b, w, i) => (w.w.length > words[b].w.length ? i : b), 0)];
          const text = pw.map((i) => words[i].w).join(' ').toUpperCase();
          const pfs = Math.min(230 * u, (W * 0.94) / (text.length * 0.62));
          const big = lineBox(portrait ? H * 0.3 : H * 0.34, pfs, W * 0.98, 'power');
          Object.assign(big.style, { flexWrap: 'nowrap', columnGap: '0px' });
          const ps = mk('w', big, text);
          showHide(big, l);
          gsap.set(ps, { opacity: 0, x: -W * 0.08, scale: 1.08, filter: 'blur(16px)' });
          tl.to(ps, { opacity: 1, x: 0, scale: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, words[pw[0]].s);
          const rest = words.filter((_, i) => !pw.includes(i));
          const sfs = 46 * u * (portrait ? 1.1 : 1);
          const small = lineBox(lowY, sfs, W * (portrait ? 0.84 : 0.7), 'sans');
          small.style.overflow = 'hidden'; small.style.paddingTop = small.style.paddingBottom = sfs * 0.15 + 'px';
          const ss = rest.map((w) => mk('w', small, w.w));
          showHide(small, l);
          ss.forEach((sp, i) => { gsap.set(sp, { yPercent: 120, opacity: 0 }); tl.to(sp, { yPercent: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, rest[i].s); });
          lineEls.set(l, [big]);
          sfx.push({ cue: 'whoosh-simple', at: +words[pw[0]].s.toFixed(2), note: 'power word' });
        } else if (l.mode === 'apple') {
          // Light gradient title that drops in with a 4-keyframe bounce (4, 5, 4 frames).
          const fs = 64 * u * (portrait ? 1.1 : 1);
          const el = lineBox(l.title ? (portrait ? H * 0.17 : H * 0.14) : lowY, fs, W * (portrait ? 0.84 : 0.72), 'apple');
          const spans = words.map((w) => mk('w', el, w.w));
          showHide(el, l);
          spans.forEach((sp, i) => {
            const t = words[i].s, f = 1 / 30;
            gsap.set(sp, { opacity: 0, y: -fs * 0.7 });
            tl.to(sp, { opacity: 1, y: fs * 0.14, duration: 4 * f, ease: 'power2.in' }, t);
            tl.to(sp, { y: -fs * 0.05, duration: 5 * f, ease: 'sine.inOut' }, t + 4 * f);
            tl.to(sp, { y: 0, duration: 4 * f, ease: 'sine.out' }, t + 9 * f);
          });
          lineEls.set(l, [el]);
        } else if (l.mode === 'pop-rise') {
          // Each word pops up but rises out of a baseline (its bottom stays cut until it's in place).
          const fs = 62 * u * (portrait ? 1.1 : 1);
          const el = lineBox(lowY, fs, W * (portrait ? 0.84 : 0.7), 'sans');
          const inner = words.map((w) => { const r = mk('w rise', el); const s = document.createElement('span'); s.textContent = w.w; r.appendChild(s); return s; });
          showHide(el, l);
          inner.forEach((sp, i) => {
            gsap.set(sp, { yPercent: 105, scale: 0.85, transformOrigin: '50% 100%' });
            tl.to(sp, { yPercent: 0, scale: 1, duration: 0.5, ease: 'back.out(1.8)' }, words[i].s);
          });
          lineEls.set(l, [el]);
          sfx.push({ cue: 'pop', at: +l.start.toFixed(2), note: 'pop-rise line' });
        } else if (l.mode === 'box') {
          // A build line with a rectangle drawn around the key word(s): dashed by default, or solid/dotted/fill.
          const fs = 58 * u * (portrait ? 1.1 : 1);
          const el = lineBox(lowY, fs, W * (portrait ? 0.84 : 0.7), 'sans');
          const spans = words.map((w) => mk('w', el, w.w));
          showHide(el, l);
          const style = ['solid', 'dotted', 'fill'].includes(l.boxStyle) ? l.boxStyle : 'dashed';
          spans.forEach((sp, i) => {
            const t = words[i].s;
            gsap.set(sp, { opacity: 0, y: fs * 0.18 }); tl.to(sp, { opacity: 1, y: 0, duration: 0.14, ease: 'power2.out' }, t);
            if (!inList(l.box, words[i].w)) return;
            sp.style.position = 'relative';
            const b = mk('boxmark', sp);
            Object.assign(b.style, { left: -fs * 0.16 + 'px', right: -fs * 0.16 + 'px', top: -fs * 0.06 + 'px', bottom: -fs * 0.1 + 'px' },
              style === 'fill' ? { background: '__ACCENT__', zIndex: -1 } : { border: Math.max(3, 5 * u) + 'px ' + style + ' __ACCENT_LIGHT__', boxShadow: '0 0 14px rgba(0, 0, 0, .45)' });
            if (style === 'fill') sp.style.isolation = 'isolate';
            gsap.set(b, { clipPath: 'inset(0 100% 0 0)' });
            tl.to(b, { clipPath: 'inset(0 0% 0 0)', duration: 0.3, ease: 'power2.inOut' }, t + 0.05);
            sfx.push({ cue: 'stretch', at: +(t + 0.05).toFixed(2), note: 'box around the key word' });
          });
          lineEls.set(l, [el]);
        } else if (l.mode === 'tilt') {
          // stack/scattered words with a 3D tilt and mixed sizes; accent words light purple.
          const fs = 64 * u * (portrait ? 1.05 : 1);
          const el = lineBox(portrait ? lowY - fs * 0.2 : H * 0.62, fs, W * (portrait ? 0.86 : 0.6), 'sans');
          Object.assign(el.style, { perspective: fs * 12 + 'px', rowGap: fs * 0.02 + 'px', columnGap: fs * 0.2 + 'px', lineHeight: 0.95 });
          const spans = words.map((w) => mk('w', el, w.w));
          showHide(el, l);
          spans.forEach((sp, i) => {
            const size = 0.75 + rand() * 0.85;
            sp.style.fontSize = fs * size + 'px'; sp.style.fontWeight = size > 1.15 ? 900 : 800;
            if (inList(l.accent, words[i].w)) sp.style.color = '__ACCENT_LIGHT__';
            const rx = (rand() - 0.5) * 30, ry = (rand() - 0.5) * 40, rz = (rand() - 0.5) * 12;
            gsap.set(sp, { opacity: 0, rotationX: rx + 50, rotationY: ry, rotationZ: rz, scale: 0.6 });
            tl.to(sp, { opacity: 1, rotationX: rx, scale: 1, duration: 0.35, ease: 'back.out(1.7)' }, words[i].s);
          });
          lineEls.set(l, [el]);
          sfx.push({ cue: 'pop', at: +l.start.toFixed(2), note: 'tilt words' });
        }
      }

      // ---- looks: gradient, premium, shine, flicker (any mode, via "look") ----
      // Every line made with lineBox registered its elements; power-split keeps only its power word.
      curLine = null;
      for (const l of lines.filter((x) => x.look)) {
        const looks = [].concat(l.look);                     // one look, or several ("premium" + "shine")
        for (const el of lineEls.get(l) || []) {
          if (looks.includes('gradient')) el.classList.add('look-gradient');
          if (looks.includes('negative')) el.classList.add('look-negative');   // composite with: node studio/fx.mjs negative
          if (looks.includes('flash')) {
            // each word lands under a solid white box that shows for one frame, then the word is there
            const ws = [...el.querySelectorAll('.w')];
            ws.forEach((w, i) => {
              const t = (l.words[i] || l.words[l.words.length - 1]).s;
              w.style.position = 'relative';
              const b = mk('flashbox', w); gsap.set(b, { opacity: 0 });
              tl.set(b, { opacity: 1 }, t); tl.set(b, { opacity: 0 }, t + 1 / 30);
            });
            sfx.push({ cue: 'whoosh-flash', at: +l.start.toFixed(2), note: 'white flash reveal' });
          }
          if (looks.includes('premium')) el.classList.add('look-premium');
          if (looks.includes('flicker')) {
            // 6 one-frame flickers on entry, then it holds (the line's own motion runs underneath)
            for (let i = 0; i <= 6; i++) tl.set(el, { opacity: i % 2 ? 0 : 1 }, l.start + i / 30);
            tl.set(el, { opacity: 1 }, l.start + 7 / 30);
            sfx.push({ cue: 'glitch', at: +l.start.toFixed(2), note: 'flicker entrance (keep quiet)' });
          }
          if (looks.includes('shine')) {
            // A copy of the line on top, its letters filled only by a soft moving band of a lighter colour
            // (Zeven 7: lighter duplicate, film-strip mask ~50 wide, rotated ~10°, feather ~50, plus glow), once,
            // after it lands. "shine": "gold" or "silver" for those finishes; default is a light brand lavender.
            const copy = el.cloneNode(true);
            copy.classList.add('shine');
            copy.style.setProperty('--shine', { gold: '#FFD9A0', silver: '#E8EAEE' }[l.shine] || '#EDE9FE');
            el.parentNode.appendChild(copy);
            const cs = [...copy.querySelectorAll('.w')];
            copy.style.opacity = 1;
            copy.querySelectorAll('*').forEach((c) => { c.style.opacity = 1; c.style.transform = 'none'; c.style.filter = ''; c.style.clipPath = 'none'; });
            const at = l.last + 0.05;                       // inside the line's 0.6 s hold
            gsap.set(copy, { opacity: 0 });
            tl.set(copy, { opacity: 1 }, at);
            // one light travelling across the line: each word's sweep starts a little after the one before it
            cs.forEach((c, i) => { gsap.set(c, { backgroundPosition: '120% 0' }); tl.to(c, { backgroundPosition: '-20% 0', duration: 0.28, ease: 'none' }, at + (i / cs.length) * 0.3); });
            tl.set(copy, { opacity: 0 }, at + 0.6);
          }
        }
      }
      tl.set({}, {}, DUR);                                   // timeline spans the whole overlay
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      window.__sfx = sfx;                                    // ready-made sfx.json cues for these captions
    </script>
  </body>
</html>
