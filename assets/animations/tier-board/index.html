<!doctype html>
<!-- Tier board: an S-F tier list over the footage. As each item is named, a big picture
     card hard-cuts in over the board (two-line caps title: accent top word, white bottom
     word), holds, then on the tier word shrinks and flies into its row as a thumbnail,
     after any cards already there. Transparent background, made to sit over footage
     (9:16 above the head, 16:9 on the right half). --text is "Top | Bottom > Tier" per
     item, comma separated ("Google | Reviews > B, Referral | Program > S"). --times is
     two numbers per item from the transcript: when the name starts, when the tier word
     starts ("4.58,5.82,13.45,14.53"); the card cuts in 0.12 s before the name. --images
     gives a picture per item in the same order; without one the card is a dark tile with a
     small 3D icon of what the item is (picked from its name, or named with --icons).
     Sounds: "pop" at each window.__pops, "stamp" at each window.__lands. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
      #board { position: absolute; background: #141414; border: 2px solid __ACCENT__66; box-shadow: 0 0 40px __ACCENT_DEEP__88, 0 20px 50px rgba(0, 0, 0, .45); }
      .row { position: absolute; left: 0; right: 0; background: #1c1c1c; }
      .label { position: absolute; left: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #1a1a1a; }
      .card { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; opacity: 0;
        background: linear-gradient(150deg, #2a2438 0%, #121016 100%); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
      .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .card img.icon { inset: auto; left: 50%; top: 52%; width: auto; height: 42%; transform: translate(-50%, -50%); object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .55)); }
      .card .halo { position: absolute; left: 50%; top: 52%; width: 60%; height: 90%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, __ACCENT__55, transparent); }
      .card .t { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; text-transform: uppercase; line-height: 1; letter-spacing: -.01em;
        -webkit-text-stroke: .045em #000; paint-order: stroke fill; text-shadow: 0 .06em .12em rgba(0, 0, 0, .6); white-space: nowrap; }
      .card .top { top: 5%; color: __ACCENT_LIGHT__; }
      .card .bot { bottom: 6%; color: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="__W__" data-height="__H__">
      <div id="board"></div>
    </div>
    <script>
      const W = __W__, H = __H__, TEXT = __TEXT__, DUR = __DURATION__, IMAGES = __IMAGES__, TIMES = __TIMES__;
      const portrait = H > W;
      const TIERS = ['S', 'A', 'B', 'C', 'D', 'E', 'F'];
      const COLOURS = ['#F2727A', '#F5B57E', '#FBFB86', '#86F088', '#86C3F7', '#8780F1', '#EE72F0'];
      const items = TEXT.split(',').map((s) => s.trim()).filter(Boolean).map((s) => {
        const [name, tier] = s.split('>').map((x) => x.trim());
        const [top, bot = ''] = name.split('|').map((x) => x.trim());
        return { top, bot, tier: TIERS.includes((tier || '').toUpperCase()) ? tier.toUpperCase() : 'C' };
      });
      // Moments: given pairs (name, tier word), otherwise even spacing.
      items.forEach((it, i) => {
        const at = TIMES[i * 2], drop = TIMES[i * 2 + 1];
        it.at = at ?? 0.8 + i * 3.2;
        it.drop = drop ?? it.at + 1.3;
      });

      // Board: 9:16 above the head (top ~40%), 16:9 on the right half.
      const bw = portrait ? W * 0.71 : W * 0.42, bh = portrait ? H * 0.32 : H * 0.78;
      const bx = portrait ? (W - bw) / 2 : W * 0.54, by = portrait ? H * 0.07 : (H - bh) / 2;
      const board = document.getElementById('board');
      Object.assign(board.style, { left: bx + 'px', top: by + 'px', width: bw + 'px', height: bh + 'px' });
      const pad = bh * 0.016, gap = bh * 0.012;
      const rowH = (bh - pad * 2 - gap * (TIERS.length - 1)) / TIERS.length;
      const labelW = rowH * 1.05;
      TIERS.forEach((t, i) => {
        const r = document.createElement('div'); r.className = 'row';
        Object.assign(r.style, { top: pad + i * (rowH + gap) + 'px', height: rowH + 'px', left: pad + 'px', right: pad + 'px' });
        const l = document.createElement('div'); l.className = 'label'; l.textContent = t;
        Object.assign(l.style, { width: labelW + 'px', background: COLOURS[i], fontSize: rowH * 0.32 + 'px' });
        r.appendChild(l); board.appendChild(r);
      });

      // Card: big over the middle of the board, 16:9-ish; thumbnail fills a row's height.
      const cw = bw * 0.58, ch = cw / 1.76;
      const cx = (bw - cw) / 2 + bw * 0.05, cy = (bh - ch) / 2;
      const thumbH = rowH * 0.88, scale = thumbH / ch, thumbW = cw * scale, slotGap = rowH * 0.12;
      const filled = Object.fromEntries(TIERS.map((t) => [t, 0]));
      const cards = items.map((it, i) => {
        const c = document.createElement('div'); c.className = 'card';
        Object.assign(c.style, { width: cw + 'px', height: ch + 'px' });
        const media = IMAGES[i];
        if (typeof media === 'string') { const img = document.createElement('img'); img.src = media; c.appendChild(img); }
        else if (media && media.icon) {
          const halo = document.createElement('div'); halo.className = 'halo';
          const img = document.createElement('img'); img.className = 'icon'; img.src = media.icon; c.append(halo, img);
        }
        const top = document.createElement('div'); top.className = 't top'; top.textContent = it.top;
        const bot = document.createElement('div'); bot.className = 't bot'; bot.textContent = it.bot;
        // Shrink long titles to fit the card's width.
        [[top, it.top], [bot, it.bot]].forEach(([el, s]) => { el.style.fontSize = Math.min(ch * 0.22, (cw * 0.92) / Math.max(4, s.length * 0.66)) + 'px'; });
        c.append(top, bot); board.appendChild(c);
        const row = TIERS.indexOf(it.tier), slot = filled[it.tier]++;
        it.tx = pad + labelW + slotGap + slot * (thumbW + slotGap);
        it.ty = pad + row * (rowH + gap) + (rowH - thumbH) / 2;
        return c;
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(board, { opacity: 0, y: -bh * 0.04, duration: 0.4, ease: 'power3.out' }, 0);
      const pops = [], lands = [];
      items.forEach((it, i) => {
        const c = cards[i], inAt = Math.max(0.3, it.at - 0.12), dropAt = Math.max(inAt + 0.4, it.drop - 0.05);
        tl.set(c, { x: cx, y: cy, scale: 1, opacity: 1, zIndex: 10 + i }, inAt);   // hard cut in, no ease
        tl.to(c, { x: it.tx, y: it.ty, scale, duration: 0.5, ease: 'power2.inOut' }, dropAt);
        tl.set(c, { zIndex: 1 }, dropAt + 0.5);
        pops.push(+inAt.toFixed(2)); lands.push(+(dropAt + 0.5).toFixed(2));
      });
      tl.set({}, {}, DUR);
      window.__timelines['main'] = tl;
      window.__pops = pops;      // a "pop" sound at each of these
      window.__lands = lands;    // a "stamp" sound as each card lands in its row
    </script>
  </body>
</html>
