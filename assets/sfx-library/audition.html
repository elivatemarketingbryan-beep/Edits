const KEY='sfx-audition-flags';let flags=new Set();try{flags=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...flags]))}catch(e){}};
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byId=Object.fromEntries(DATA.map(s=>[s.i,s]));
const audio=new Audio();let cur=null;const $=s=>document.querySelector(s);let onlyFlag=false;
function render(){const c=$('#cat').value,t=$('#tier').value,l=$('#lic').value,ed=$('#ed').value,q=$('#q').value.toLowerCase();
const rows=DATA.filter(s=>(!c||s.c===c)&&(!t||s.t===t)&&(!l||String(+s.a)===l)&&(!ed||String(+s.ed)===ed)&&(!onlyFlag||flags.has(s.i))&&(!q||(s.n+' '+s.d+' '+s.u.join(' ')+' '+s.fam+' '+s.i).toLowerCase().includes(q)));
$('#count').textContent=rows.length+' sounds · '+flags.size+' flagged';
$('#list').innerHTML=rows.map(s=>`<div class="row" data-i="${s.i}"><button class="play" data-f="${encodeURI(s.f)}" aria-label="Play ${esc(s.n)}">▶</button>
<div><div><span class="nm">${esc(s.n)}</span><span class="id">${s.i} · ${s.t} · ${s.ms} ms · q${s.q}${s.loop?' · loop':''}${s.ed?' · cut-ready edit':''}</span></div><div class="ds">${esc(s.d)}</div>
<div class="chips"><span>${esc(s.c)}</span><span>${esc(s.tone)}</span>${s.u.map(u=>`<span>${esc(u)}</span>`).join('')}${s.a?'<span class="cr">credit required</span>':''}</div></div>
<button class="flag ${flags.has(s.i)?'on':''}" data-flag="${s.i}">${flags.has(s.i)?'Flagged':'Flag'}</button></div>`).join('');}
document.addEventListener('click',e=>{const p=e.target.closest('.play');if(p){const row=p.closest('.row');if(cur===row&&!audio.paused){audio.pause();return}
document.querySelectorAll('.row.playing').forEach(r=>r.classList.remove('playing'));cur=row;row.classList.add('playing');
const s=byId[row.dataset.i];audio.volume=$('#lm').checked?Math.min(1,Math.pow(10,(-23-s.m)/20)):1;audio.src=p.dataset.f;audio.play();return}
const f=e.target.closest('[data-flag]');if(f){const i=f.dataset.flag;flags.has(i)?flags.delete(i):flags.add(i);save();render();}});
['#cat','#tier','#lic','#ed'].forEach(s=>$(s).addEventListener('change',render));$('#q').addEventListener('input',render);
$('#onlyflag').addEventListener('click',e=>{onlyFlag=!onlyFlag;e.target.classList.toggle('on',onlyFlag);render()});
$('#copy').addEventListener('click',async()=>{const t=[...flags].sort().join(', ');try{await navigator.clipboard.writeText(t);$('#copy').textContent='Copied '+flags.size}catch(e){prompt('Flagged IDs',t)}setTimeout(()=>$('#copy').textContent='Copy flagged IDs',1500)});
render();
</script></body></html>
